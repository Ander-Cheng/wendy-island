<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wendy 島 3D｜寶寶・我的女朋友</title>
<style>
  :root{
    --coral:#ff5d8f;
    --sea-deep:#2a6f97;
    --ink:#2b2d42;
    --cream:#fffaf3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #loader{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:linear-gradient(180deg,#caf0f8,#a9d6e5);color:var(--sea-deep);
    transition:opacity .6s;
  }
  #loader.hide{opacity:0;pointer-events:none}
  .spin{width:54px;height:54px;border:6px solid #fff;border-top-color:var(--coral);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  #title{position:fixed;top:22px;left:0;width:100%;text-align:center;z-index:10;pointer-events:none}
  #title h1{font-size:clamp(2rem,7vw,3.4rem);color:#fff;letter-spacing:2px;text-shadow:0 3px 0 var(--coral),0 8px 20px rgba(42,111,151,.4)}
  #title p{margin-top:8px;font-size:clamp(.85rem,3vw,1.1rem);color:var(--sea-deep);display:inline-block;background:rgba(255,255,255,.7);padding:6px 18px;border-radius:999px}
  #title p b{color:var(--coral)}

  #hint{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(255,255,255,.82);color:var(--sea-deep);padding:9px 20px;border-radius:999px;
    font-size:.9rem;box-shadow:0 6px 18px rgba(42,111,151,.25);text-align:center;max-width:92vw;
    transition:opacity .5s;
  }

  #card{
    position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
    width:min(440px,90vw);max-height:82vh;overflow:auto;background:var(--cream);
    border-radius:24px;padding:28px 26px 26px;box-shadow:0 24px 60px rgba(42,111,151,.4);
    border:4px solid #fff;opacity:0;pointer-events:none;transition:all .3s;
  }
  #card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #card .close{position:absolute;top:12px;right:16px;font-size:26px;cursor:pointer;color:#bbb;border:none;background:none}
  #card .close:hover{color:var(--coral)}
  #card .ic{font-size:50px;text-align:center}
  #card h2{text-align:center;color:var(--coral);margin:8px 0 16px;font-size:1.6rem}
  #card .body{color:#55707f;line-height:1.75;font-size:1.02rem}
  #card .body .row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #ffe0ea}
  #card .body .row:last-child{border-bottom:none}
  #card .body .row .k{font-size:28px;flex:0 0 auto}
  #card .body .row .v b{color:var(--coral)}
  #card .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  #card .chip{background:#fff0f5;color:var(--coral);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.95rem}
  #card .group-title{font-weight:800;color:var(--sea-deep);margin:14px 0 6px;font-size:1.05rem}
  #card .photo{width:100%;border-radius:16px;margin:10px 0 4px;box-shadow:0 8px 22px rgba(42,111,151,.28);border:3px solid #fff;display:block}
  #card .photo-cap{text-align:center;color:#7a95a3;font-size:.9rem;margin-bottom:6px}

  /* propose card */
  #card.propose{border-color:#ff8fab;box-shadow:0 24px 70px rgba(255,93,143,.5);background:linear-gradient(180deg,#fffaf3,#fff0f5)}
  #card.propose h2{font-size:1.8rem;background:linear-gradient(90deg,#ff5d8f,#ff8fab);-webkit-background-clip:text;background-clip:text;color:transparent;animation:beat 1.6s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.06)}}
  #yesBtn{font-size:1.25rem;font-weight:800;color:#fff;cursor:pointer;border:none;padding:14px 42px;border-radius:999px;
    background:linear-gradient(90deg,#ff5d8f,#ff8fab);box-shadow:0 10px 24px rgba(255,93,143,.5);transition:transform .2s;animation:beat 1.4s infinite}
  #yesBtn:hover{transform:scale(1.08)}
  #yesBtn:active{transform:scale(.96)}

  #back2d{
    position:fixed;top:18px;right:18px;z-index:10;background:rgba(255,255,255,.85);
    color:var(--sea-deep);text-decoration:none;padding:8px 16px;border-radius:999px;
    font-size:.88rem;font-weight:700;box-shadow:0 6px 16px rgba(42,111,151,.25);
  }
  #back2d:hover{background:#fff}

  #dayNightBtn{
    position:fixed;top:60px;right:18px;z-index:10;background:rgba(255,255,255,.85);
    color:var(--sea-deep);border:none;cursor:pointer;padding:8px 16px;border-radius:999px;
    font-size:.88rem;font-weight:700;box-shadow:0 6px 16px rgba(42,111,151,.25);
    font-family:inherit;
  }
  #dayNightBtn:hover{background:#fff}

  #bgmBtn{
    position:fixed;top:102px;right:18px;z-index:10;background:rgba(255,255,255,.85);
    color:var(--sea-deep);border:none;cursor:pointer;padding:8px 16px;border-radius:999px;
    font-size:.88rem;font-weight:700;box-shadow:0 6px 16px rgba(42,111,151,.25);
    font-family:inherit;
  }
  #bgmBtn:hover{background:#fff}

  /* ---- 旅行島相簿 ---- */
  .trip-album{padding:10px 0;border-bottom:1px dashed #ffe0ea}
  .trip-album:last-child{border-bottom:none}
  .trip-head{font-size:1.1rem;color:var(--sea-deep)}
  .trip-head .trip-flag{font-size:1.4rem;margin-right:6px}
  .trip-note{color:#6b7b86;line-height:1.7;margin:4px 0 8px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px}
  .thumb{width:84px;height:84px;object-fit:cover;border-radius:12px;border:3px solid #fff;
    box-shadow:0 6px 16px rgba(42,111,151,.22);cursor:pointer;transition:transform .2s}
  .thumb:hover{transform:scale(1.06)}
  .photo-ph{background:#fff0f5;color:#b58aa0;border-radius:12px;padding:16px;text-align:center;font-size:.92rem}
  #card .photo{cursor:zoom-in}

  /* ---- 照片燈箱 Lightbox ---- */
  #lightbox{
    position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(20,28,38,.82);opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #lightbox.show{opacity:1;pointer-events:auto}
  #lightbox img{
    max-width:88vw;max-height:80vh;border-radius:18px;border:4px solid #fff;
    box-shadow:0 24px 70px rgba(0,0,0,.5);background:#fff;
  }
  #lightbox .lb-close{position:absolute;top:18px;right:22px;font-size:34px;line-height:1;color:#fff;
    background:none;border:none;cursor:pointer;opacity:.85}
  #lightbox .lb-close:hover{opacity:1}
  #lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;line-height:1;
    color:#fff;background:rgba(255,255,255,.18);border:none;cursor:pointer;width:54px;height:54px;
    border-radius:50%;opacity:.9;user-select:none}
  #lightbox .lb-nav:hover{background:rgba(255,255,255,.3)}
  #lightbox .lb-nav[disabled]{opacity:.25;cursor:default}
  #lightbox .lb-prev{left:16px}
  #lightbox .lb-next{right:16px}
  #lightbox .lb-count{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    color:#fff;background:rgba(0,0,0,.4);padding:6px 16px;border-radius:999px;font-size:.9rem;font-weight:700}
</style>
</head>
<body>
  <div id="app"></div>

  <div id="loader">
    <div class="spin"></div>
    <div>正在組合 Wendy 島…</div>
  </div>

  <div id="title">
    <h1>Wendy 島</h1>
    <p>暱稱 <b>寶寶</b> ・ 我的女朋友 ・ <b>讓人又愛又恨</b> 😤❤️</p>
  </div>

  <a id="back2d" href="index.html?stay=1">← 2D 版</a>
  <button id="dayNightBtn" title="切換日夜模式">🔄 自動</button>
  <button id="bgmBtn" title="背景音樂開關">🔇 音樂</button>

  <div id="hint">🖱️ 拖曳旋轉 ・ 滾輪縮放 ・ 點島上的人物與周邊小島，認識 Wendy 這個人　🌗 右上可切換白天／黃昏／夜晚</div>

  <div id="card">
    <button class="close" aria-label="close">×</button>
    <div class="ic" id="card-ic">💖</div>
    <h2 id="card-title">標題</h2>
    <div class="body" id="card-body"></div>
  </div>

  <!-- 照片燈箱（通用元件，家人/好友/求婚/旅行島共用） -->
  <div id="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="關閉">×</button>
    <button class="lb-nav lb-prev" aria-label="上一張">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-nav lb-next" aria-label="下一張">›</button>
    <div class="lb-count" id="lb-count"></div>
  </div>

  <!-- 資料外置：classic script，確保早於 module 執行，window.ISLAND_DATA 可用 -->
  <script src="data.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const loaderEl = document.getElementById('loader');
  const hintEl = document.getElementById('hint');

  // ========================= 外置資料（data.js）防呆讀取 =========================
  const D = window.ISLAND_DATA || {};
  const animalsData = Array.isArray(D.animals) ? D.animals : [];
  const familyData  = Array.isArray(D.family)  ? D.family  : [];
  const friendsData = Array.isArray(D.friends) ? D.friends : [];
  const tripsData   = Array.isArray(D.trips)   ? D.trips   : [];
  const photosData  = D.photos || {};
  const audioData   = D.audio  || {};

  // ========================= scene =========================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe9f5);
  scene.fog = new THREE.Fog(0xbfe9f5, 60, 150);

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
  camera.position.set(24, 22, 30);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.getElementById('app').appendChild(renderer.domElement);

  let fly = null;
  let proposeActive = false;
  let ringGiven = false;

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 6;
  controls.maxDistance = 80;
  controls.maxPolarAngle = Math.PI/2.15;
  controls.target.set(0, 1.5, 0);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  // ========================= lights =========================
  const hemi = new THREE.HemisphereLight(0xfff4e6, 0x9ad0e5, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d8, 1.15);
  sun.position.set(18, 28, 16);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
  sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
  sun.shadow.camera.far = 90;
  sun.shadow.bias = -0.0004;
  sun.shadow.radius = 4;
  scene.add(sun);
  // soft fill light from opposite side so shadows aren't dead-black
  const fill = new THREE.DirectionalLight(0xbfe0ff, 0.35);
  fill.position.set(-16, 12, -14);
  scene.add(fill);

  // ========================= 日夜循環系統 =========================
  // 三個 preset：白天（現況藍天）／黃昏（橘粉金、低太陽長影）／夜晚（深藍紫、星空、弱光）
  const DAY = {
    bg:0xbfe9f5, fog:0xbfe9f5,
    hemiSky:0xfff4e6, hemiGround:0x9ad0e5, hemiInt:0.85,
    sunColor:0xfff0d8, sunInt:1.15, sunPos:new THREE.Vector3(18,28,16),
    fillColor:0xbfe0ff, fillInt:0.35,
    exposure:1.05, stars:0.0,
    sea:0x4ba3c7, reflDim:0.18
  };
  const DUSK = {
    bg:0xffb27a, fog:0xffa06b,
    hemiSky:0xffd9a0, hemiGround:0xb08a6a, hemiInt:0.7,
    sunColor:0xff8a4c, sunInt:1.0, sunPos:new THREE.Vector3(26,8,10),
    fillColor:0xffb27a, fillInt:0.4,
    exposure:1.1, stars:0.15,
    sea:0xd98a5a, reflDim:0.22
  };
  const NIGHT = {
    // 月夜：提高環境光底線，避免整座島全黑（仍保留夜晚偏藍的氛圍）
    bg:0x222a56, fog:0x2b3360,
    hemiSky:0x5a6ba8, hemiGround:0x242a56, hemiInt:0.72,
    sunColor:0x9fb0e0, sunInt:0.55, sunPos:new THREE.Vector3(-18,20,-14),   // 當作月光，角度拉高一點
    fillColor:0x6a78b0, fillInt:0.42,
    exposure:1.02, stars:1.0,
    sea:0x273566, reflDim:0.14
  };

  // 星空（夜晚顯示），約 420 點
  let starPoints;
  (function buildStars(){
    const N=420, arr=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      // 分佈於天空半球外圈
      const r=120+Math.random()*60;
      const theta=Math.random()*Math.PI*2;
      const phi=Math.random()*Math.PI*0.5;          // 上半球
      arr[i*3]   = Math.cos(theta)*Math.sin(phi)*r;
      arr[i*3+1] = Math.cos(phi)*r*0.9 + 10;
      arr[i*3+2] = Math.sin(theta)*Math.sin(phi)*r;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(arr,3));
    const mat=new THREE.PointsMaterial({ color:0xfffbe0, size:1.4, sizeAttenuation:false,
      transparent:true, opacity:0, depthWrite:false });
    starPoints=new THREE.Points(geo,mat);
    starPoints.renderOrder=-1;
    scene.add(starPoints);
  })();

  const _cA=new THREE.Color(), _cB=new THREE.Color();
  function lerpColorHex(a,b,k,out){ _cA.setHex(a); _cB.setHex(b); out.copy(_cA).lerp(_cB,k); }
  const _lerp=(a,b,k)=>a+(b-a)*k;

  // reflection / sea 回呼（由第 5 項倒影系統註冊）
  let dayNightHooks = [];

  function applyPreset(a, b, k){
    lerpColorHex(a.bg, b.bg, k, scene.background);
    if(scene.fog) lerpColorHex(a.fog, b.fog, k, scene.fog.color);
    lerpColorHex(a.hemiSky, b.hemiSky, k, hemi.color);
    lerpColorHex(a.hemiGround, b.hemiGround, k, hemi.groundColor);
    hemi.intensity = _lerp(a.hemiInt, b.hemiInt, k);
    lerpColorHex(a.sunColor, b.sunColor, k, sun.color);
    sun.intensity = _lerp(a.sunInt, b.sunInt, k);
    sun.position.lerpVectors(a.sunPos, b.sunPos, k);
    lerpColorHex(a.fillColor, b.fillColor, k, fill.color);
    fill.intensity = _lerp(a.fillInt, b.fillInt, k);
    renderer.toneMappingExposure = _lerp(a.exposure, b.exposure, k);
    if(starPoints) starPoints.material.opacity = _lerp(a.stars, b.stars, k);
    const seaCol = _cA.clone(); lerpColorHex(a.sea, b.sea, k, seaCol);
    const reflDim = _lerp(a.reflDim, b.reflDim, k);
    dayNightHooks.forEach(fn => fn(seaCol, reflDim, k, a, b));
  }

  // 由 phase(0..1) 計算目前日夜狀態並套用
  //  0.00..0.33 日→黃昏；0.33..0.66 黃昏→夜；0.66..1 夜→日
  function applyDayNightPhase(phase){
    const p = ((phase % 1) + 1) % 1;
    if(p < 1/3)      applyPreset(DAY,  DUSK,  p/(1/3));
    else if(p < 2/3) applyPreset(DUSK, NIGHT, (p-1/3)/(1/3));
    else             applyPreset(NIGHT,DAY,   (p-2/3)/(1/3));
  }

  // 日夜狀態
  const DN_CYCLE = 150;              // 一圈約 2.5 分鐘
  let dayNightPhase = 0;             // 從白天開始
  let dnAuto = true;                 // 自動循環
  let dnTween = null;                // 平滑過渡 {from,to,t,dur,after}
  // 手動模式輪替：自動 → 白天 → 黃昏 → 夜晚 → 自動
  const DN_MODES = [
    { label:'🔄 自動', auto:true,  phase:null },
    { label:'☀️ 白天', auto:false, phase:0.0 },
    { label:'🌇 黃昏', auto:false, phase:1/3 },
    { label:'🌙 夜晚', auto:false, phase:2/3 }
  ];
  let dnModeIdx = 0;
  const dayNightBtn = document.getElementById('dayNightBtn');
  function startDnTween(toPhase, dur, after){
    dnTween = { from:dayNightPhase, to:toPhase, t:0, dur:dur||1.2, after:after||null };
  }
  dayNightBtn.addEventListener('click', ()=>{
    dnModeIdx = (dnModeIdx + 1) % DN_MODES.length;
    const m = DN_MODES[dnModeIdx];
    dayNightBtn.textContent = m.label;
    dnAuto = m.auto;
    if(!m.auto) startDnTween(m.phase, 1.0);
  });

  // 求婚聯動：強制平滑切到黃昏 + 點燈；關卡未答應再還原
  let proposeForcedDusk = false;
  let dnSaved = null;
  function forceDuskForPropose(){
    if(!proposeForcedDusk){
      dnSaved = { phase:dayNightPhase, auto:dnAuto, modeIdx:dnModeIdx };
    }
    proposeForcedDusk = true;
    dnAuto = false;
    setWarmLights(true);
    startDnTween(1/3, 1.6);          // 平滑切到黃昏
  }
  function restoreDayNightAfterPropose(){
    if(!proposeForcedDusk) return;
    proposeForcedDusk = false;
    setWarmLights(false);
    if(dnSaved){
      dnAuto = dnSaved.auto; dnModeIdx = dnSaved.modeIdx;
      dayNightBtn.textContent = DN_MODES[dnModeIdx].label;
      startDnTween(dnSaved.phase, 1.6);
    }
    dnSaved = null;
  }
  // 暖色點燈（家人島/好友島/營火）—— 物件於下方倒影/島嶼建立後註冊
  const warmLights = [];
  function setWarmLights(on){ warmLights.forEach(l=> l.userData.targetInt = on ? l.userData.onInt : 0); }

  // flat-shaded material (low-poly facets) — keep for terrain/foliage
  const flat = (c) => new THREE.MeshStandardMaterial({ color:c, flatShading:true, roughness:.9, metalness:0 });
  // smooth material (rounded, soft) — for characters & animals
  const soft = (c, rough=0.75) => new THREE.MeshStandardMaterial({ color:c, flatShading:false, roughness:rough, metalness:0 });

  // ========================= sea =========================
  const seaGeo = new THREE.PlaneGeometry(240, 240, 90, 90);
  const seaMat = new THREE.MeshStandardMaterial({ color:0x4ba3c7, flatShading:true, roughness:.6, transparent:true, opacity:.95 });
  const sea = new THREE.Mesh(seaGeo, seaMat);
  sea.rotation.x = -Math.PI/2; sea.position.y = -0.4; sea.receiveShadow = true;
  scene.add(sea);
  const seaBase = seaGeo.attributes.position.array.slice();

  // ========================= main island =========================
  const island = new THREE.Group();
  scene.add(island);

  const sand = new THREE.Mesh(new THREE.CylinderGeometry(9, 11, 2.2, 10), flat(0xffe0b3));
  sand.position.y = 0.1; sand.castShadow = sand.receiveShadow = true; island.add(sand);
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 2, 5, 9), flat(0xb5835a));
  dirt.position.y = -3; island.add(dirt);
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(7.6, 9, 1.2, 10), flat(0x8cd17d));
  grass.position.y = 1.3; grass.castShadow = grass.receiveShadow = true; island.add(grass);
  const hill = new THREE.Mesh(new THREE.ConeGeometry(3.2, 3.2, 8), flat(0x72c267));
  hill.position.set(-3.2, 2.6, -2.6); hill.castShadow = true; island.add(hill);

  function palm(x, z, s=1, parent=island){
    const g = new THREE.Group();
    // slightly curved trunk (stacked segments)
    for(let i=0;i<4;i++){
      const seg=new THREE.Mesh(new THREE.CylinderGeometry((.18-i*0.02)*s,(.24-i*0.02)*s,0.8*s,7),flat(0xb07a43));
      seg.position.set(Math.sin(i*0.4)*0.15*s, (0.4+i*0.8)*s, 0);
      seg.rotation.z = -i*0.05; seg.castShadow=true; g.add(seg);
    }
    const crownY = 3.4*s, crownX = Math.sin(1.6)*0.15*s;
    for(let i=0;i<7;i++){
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(.3*s, 2.3*s, 5), flat(i%2?0x5fb85a:0x6cc46a));

  const satellites = [];

  function buildSatelliteIsland(wx, wz, tint, r=3.9){
    const g = new THREE.Group();
    const sand = new THREE.Mesh(new THREE.CylinderGeometry(r*0.85, r, 1.4, 9), flat(0xffe0b3));
    sand.position.y = 0; sand.castShadow = sand.receiveShadow = true; g.add(sand);
    const dirt = new THREE.Mesh(new THREE.CylinderGeometry(r*0.7, 0.8, 3, 8), flat(0xb5835a));
    dirt.position.y = -2.1; g.add(dirt);
    const grass = new THREE.Mesh(new THREE.CylinderGeometry(r*0.72, r*0.88, 0.8, 9), flat(tint||0x8cd17d));
    grass.position.y = 0.9; grass.castShadow = grass.receiveShadow = true; g.add(grass);
    palm(r*0.5, r*0.4, 0.7, g);
    // a few flowers & grass tufts around the rim (ground top ~1.3)
    const gt = 1.3, rr = r*0.55;
    for(let i=0;i<5;i++){ const a=i*(Math.PI*2/5)+Math.random();
      flower(Math.cos(a)*rr, Math.sin(a)*rr, g, flowerCols[i%flowerCols.length], gt); }
    for(let i=0;i<4;i++){ const a=i*(Math.PI*2/4)+0.6;
      grassTuft(Math.cos(a)*rr*0.8, Math.sin(a)*rr*0.8, g, gt); }
    g.position.set(wx, 0.6, wz); scene.add(g);
    satellites.push({ group:g, phase:Math.random()*Math.PI*2, baseY:0.6 });
    return g;
  }

  // wooden bridge from main island edge toward a satellite
  function buildBridge(wx, wz, satR=3.4){
    const g = new THREE.Group();
    const dir = new THREE.Vector2(wx, wz).normalize();
    const start = 8.5;                                // main island edge
    const end = Math.hypot(wx,wz) - satR;             // satellite edge
    const len = end - start;
    const planks = Math.max(4, Math.floor(len/0.8));
    const angle = Math.atan2(wz, wx);
    for(let i=0;i<planks;i++){
      const d = start + (i+0.5)*(len/planks);
      const plank = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.14,1.2), flat(i%2?0xc99a66:0xb5835a));
      plank.position.set(dir.x*d, 1.55 + Math.sin(i*0.6)*0.05, dir.y*d);
      plank.rotation.y = -angle;
      plank.castShadow = true; g.add(plank);
    }
    // rope rails
    [-0.55,0.55].forEach(off=>{
      const rope = new THREE.Mesh(new THREE.BoxGeometry(len,0.05,0.05), flat(0xe8c39e));
      rope.position.set(dir.x*(start+len/2), 1.95, dir.y*(start+len/2));
      rope.rotation.y = -angle;
      rope.translateZ(off); g.add(rope);
    });
    scene.add(g);
  }

  function registerBlock(key, group, wx, wz, label, labelY, hitSize, tint){
    const isle = buildSatelliteIsland(wx, wz, tint);
    buildBridge(wx, wz);
    const hit = new THREE.Mesh(new THREE.BoxGeometry(hitSize,hitSize,hitSize), new THREE.MeshBasicMaterial({visible:false}));
    hit.position.y = hitSize/2; group.add(hit);
    group.add(textLabel(label, labelY));
    group.position.set(0, 1.3, 0); isle.add(group);
    group.userData = { key, baseY:1.3, phase:Math.random()*Math.PI*2, cube:hit, focus:new THREE.Vector3(wx,2,wz) };
    blocks.push(group);
    return isle;
  }

  // bigger satellite (custom radius) — used for family island
  function registerBlockBig(key, group, wx, wz, label, labelY, hitSize, tint, r){
    const isle = buildSatelliteIsland(wx, wz, tint, r);
    buildBridge(wx, wz, r);
    const hit = new THREE.Mesh(new THREE.BoxGeometry(hitSize,hitSize,hitSize), new THREE.MeshBasicMaterial({visible:false}));
    hit.position.y = hitSize/2; group.add(hit);
    group.add(textLabel(label, labelY));
    // house sits off to the back edge, leaving room for people
    group.position.set(0, 1.3, -r*0.55); isle.add(group);
    group.userData = { key, baseY:1.3, phase:Math.random()*Math.PI*2, cube:hit, focus:new THREE.Vector3(wx,2,wz) };
    blocks.push(group);
    return isle;
  }

  dayNightHooks.push(()=>{
    if(proposeForcedDusk) return;                 // 求婚點燈優先，別搶控制
    const p = ((dayNightPhase % 1)+1)%1;
    // 夜晚程度：phase 2/3 附近最暗（與粒子一致）；黃昏(1/3)就開始帶一點暖光
    const nightF = Math.max(0, 1 - Math.min(Math.abs(p-2/3), Math.abs(p-2/3+1), Math.abs(p-2/3-1))*3);
    const duskF  = Math.max(0, 1 - Math.min(Math.abs(p-1/3), Math.abs(p-1/3+1), Math.abs(p-1/3-1))*3);

  // place a little person on an island. isle = familyIsle | friendsIsle ; list = familyFolks | friendFolks
  function addPersonTo(isle, list, opt, lx, lz, name){
    const g = makePerson(opt);
    const person = new THREE.Group();
    person.add(g);
    const bubble=new THREE.Sprite(new THREE.SpriteMaterial({map:bubbleTex(name),transparent:true,depthTest:false}));
    const topY = (opt.kind==='man'?2.0:1.8)*(opt.scale||1);
    bubble.scale.set(2.2,1.1,1); bubble.position.y=topY+0.6; bubble.visible=false; person.add(bubble);
    const hit=new THREE.Mesh(new THREE.BoxGeometry(1.1,2.2*(opt.scale||1),1.1),new THREE.MeshBasicMaterial({visible:false})); hit.position.y=topY/2; person.add(hit);
    person.position.set(lx, 1.3, lz);
    person.rotation.y = Math.atan2(-lx, -lz);   // roughly face island centre
    person.userData = { bubble, hit, baseY:1.3, phase:Math.random()*Math.PI*2 };
    isle.add(person);
    list.push(person);
  }
  // shorthands
  const addFolk   = (opt, lx, lz, name)=> addPersonTo(familyIsle,  familyFolks, opt, lx, lz, name);
  const addFriend = (opt, lx, lz, name)=> addPersonTo(friendsIsle, friendFolks, opt, lx, lz, name);

  // ---- 家人島成員：依 data.js 的 family 讀資料生成 ----
  familyData.forEach(p => addFolk(p.opt || {}, p.lx, p.lz, p.name || ''));

  friendsData.forEach(p => addFriend(p.opt || {}, p.lx, p.lz, p.name || ''));

  // ========================= raycast / interaction =========================
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hovered = null, hoveredCritter = null;

  function pointer(e){ const t=e.touches?e.touches[0]:e; mouse.x=(t.clientX/innerWidth)*2-1; mouse.y=-(t.clientY/innerHeight)*2+1; }
  function pick(){ ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(blocks.map(b=>b.userData.cube),false); return h.length?blocks.find(b=>b.userData.cube===h[0].object):null; }
  function pickCritter(){ ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(residents.map(r=>r.userData.hit),false); return h.length?residents.find(r=>r.userData.hit===h[0].object):null; }
  function pickMe(){ ray.setFromCamera(mouse,camera); return ray.intersectObject(me.userData.hit,false).length?me:null; }
  const allFolks = ()=> familyFolks.concat(friendFolks);
  function pickFolk(){ ray.setFromCamera(mouse,camera); const list=allFolks(); const h=ray.intersectObjects(list.map(f=>f.userData.hit),false); return h.length?list.find(f=>f.userData.hit===h[0].object):null; }
  // which island/card a folk belongs to
  function folkInfo(f){ return friendFolks.includes(f)
    ? { card:'friends', focus:new THREE.Vector3(-19,2,19) }
    : { card:'family',  focus:new THREE.Vector3( 19,2,19) }; }
  let hoveredFolk = null;

  renderer.domElement.addEventListener('pointermove', e=>{
    pointer(e);
    const b=pick(); if(b!==hovered) hovered=b;
    const c=pickCritter();
    if(c!==hoveredCritter){ if(hoveredCritter) hoveredCritter.userData.bubble.visible=false; hoveredCritter=c; if(c) c.userData.bubble.visible=true; }
    const f=pickFolk();
    if(f!==hoveredFolk){ if(hoveredFolk) hoveredFolk.userData.bubble.visible=false; hoveredFolk=f; if(f) f.userData.bubble.visible=true; }
    const m=pickMe();
    renderer.domElement.style.cursor=(b||c||m||f)?'pointer':'grab';
  });

  let downX=0, downY=0;
  renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; });
  renderer.domElement.addEventListener('pointerup', e=>{
    if(intro) return;                            // 進場動畫期間鎖住點擊互動
    if(Math.abs(e.clientX-downX)>6 || Math.abs(e.clientY-downY)>6) return;
    pointer(e);
    if(pickMe()){ flyTo(new THREE.Vector3(0,2.2,0), 9); openCard('propose'); return; }
    const b=pick(); if(b){ flyTo(b.userData.focus, 11); openCard(b.userData.key); return; }
    const f=pickFolk(); if(f){ f.userData.bubble.visible=true; const info=folkInfo(f); flyTo(info.focus, 13); openCard(info.card); return; }
    const c=pickCritter(); if(c){ c.userData.bubble.visible=true; openCard('zoo'); }
  });

  // ========================= camera fly-to =========================
  function flyTo(targetPoint, dist){
    const dir=new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    const camTo=new THREE.Vector3().copy(targetPoint).add(dir.multiplyScalar(dist));
    camTo.y=Math.max(camTo.y, targetPoint.y+3);
    fly={ camFrom:camera.position.clone(), camTo, tgtFrom:controls.target.clone(), tgtTo:targetPoint.clone(), t:0 };
    controls.autoRotate=false;
  }

  // ========================= card =========================
  const cardEl = document.getElementById('card');

  // ========================= 照片燈箱 Lightbox =========================
  const lbEl    = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lb-img');
  const lbCount = document.getElementById('lb-count');
  const lbPrev  = lbEl.querySelector('.lb-prev');
  const lbNext  = lbEl.querySelector('.lb-next');
  const lbClose = lbEl.querySelector('.lb-close');
  let lbList = [];          // 當前相簿的照片路徑陣列
  let lbIndex = 0;
  let lightboxOpen = false;

  function openLightbox(list, idx){
    lbList = Array.isArray(list) ? list : [list];
    lbIndex = Math.max(0, Math.min(idx||0, lbList.length-1));
    renderLightbox();
    lbEl.classList.add('show'); lbEl.setAttribute('aria-hidden','false');
    lightboxOpen = true;
  }
  function renderLightbox(){
    lbImg.src = lbList[lbIndex] || '';
    const multi = lbList.length > 1;
    lbPrev.disabled = !multi; lbNext.disabled = !multi;
    lbCount.style.display = multi ? 'block' : 'none';
    if(multi) lbCount.textContent = `第 ${lbIndex+1} / 共 ${lbList.length} 張`;
  }
  function lbStep(dir){
    if(lbList.length<2) return;
    lbIndex = (lbIndex + dir + lbList.length) % lbList.length;
    renderLightbox();
  }
  function closeLightbox(){
    lbEl.classList.remove('show'); lbEl.setAttribute('aria-hidden','true');
    lightboxOpen = false; lbImg.src='';
  }
  lbPrev.addEventListener('click', e=>{ e.stopPropagation(); lbStep(-1); });
  lbNext.addEventListener('click', e=>{ e.stopPropagation(); lbStep(1); });
  lbClose.addEventListener('click', e=>{ e.stopPropagation(); closeLightbox(); });
  lbEl.addEventListener('click', e=>{ if(e.target===lbEl) closeLightbox(); });   // 點遮罩關閉
  // 手機左右滑動切換
  let lbTouchX = null;
  lbEl.addEventListener('touchstart', e=>{ lbTouchX = e.touches[0].clientX; }, {passive:true});
  lbEl.addEventListener('touchend', e=>{
    if(lbTouchX===null) return;
    const dx = e.changedTouches[0].clientX - lbTouchX;
    if(Math.abs(dx)>40) lbStep(dx<0 ? 1 : -1);
    lbTouchX = null;
  });

  // 綁定卡片內照片／縮圖：點 .photo 開單張；點 .thumb 開該旅行地點相簿
  function wireCardMedia(bodyEl){
    bodyEl.querySelectorAll('.photo').forEach(img=>{
      img.addEventListener('click', ()=> openLightbox([img.getAttribute('src')], 0));
    });
    bodyEl.querySelectorAll('.thumb').forEach(img=>{
      img.addEventListener('click', ()=>{
        const ti = parseInt(img.getAttribute('data-trip'), 10);
        const pi = parseInt(img.getAttribute('data-idx'), 10) || 0;
        const t = tripsData[ti];
        const photos = (t && Array.isArray(t.photos)) ? t.photos : [img.getAttribute('src')];
        openLightbox(photos, pi);
      });
    });
  }

  // ========================= 音訊（BGM + 音效，缺檔靜默防呆）=========================
  const bgmBtn = document.getElementById('bgmBtn');
  let bgmAudio = null, bgmOn = false;
  const sfxCache = {};

  function makeAudio(src, vol, loop){
    if(!src) return null;
    try{
      const a = new Audio(src);
      a.volume = (typeof vol==='number') ? vol : 0.5;
      a.loop = !!loop;
      a.addEventListener('error', ()=>{ /* 缺檔／載入失敗：靜默略過 */ });
      return a;
    }catch(e){ return null; }
  }
  function sfxPlay(name){
    try{
      const src = (audioData.sfx || {})[name];
      if(!src) return;
      let a = sfxCache[name];
      if(!a){ a = makeAudio(src, audioData.sfxVolume, false); sfxCache[name] = a; }
      if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
    }catch(e){ /* 靜默 */ }
  }
  function bgmSetOn(on){
    bgmOn = on;
    if(on){
      if(!bgmAudio) bgmAudio = makeAudio(audioData.bgmSrc, audioData.bgmVolume, true);
      if(bgmAudio) bgmAudio.play().catch(()=>{});   // 自動播放被擋時不報錯
      bgmBtn.textContent = '🔊 音樂';
    }else{
      if(bgmAudio) bgmAudio.pause();
      bgmBtn.textContent = '🔇 音樂';
    }
  }
  bgmBtn.addEventListener('click', ()=> bgmSetOn(!bgmOn));
  // 預設開啟時，等第一次互動再嘗試播放（遵守自動播放政策）
  if(audioData.bgmDefaultOn){
    const kick = ()=>{ bgmSetOn(true); window.removeEventListener('pointerdown', kick); };
    window.addEventListener('pointerdown', kick, {once:true});
  }

  function openCard(key){
    const d=DATA[key];
    if(!d) return;                               // 缺卡防呆，不崩潰
    sfxPlay('click');                            // 點島／開卡片音效（缺檔靜默）
    document.getElementById('card-ic').textContent=d.ic || '💖';
    document.getElementById('card-title').textContent=d.title || '';
    // zoo / trips 由資料動態生成；其餘用卡片 html
    let html;
    if(key==='zoo')      html = buildZooHtml();
    else if(key==='trips') html = buildTripsHtml();
    else                 html = d.html || '';
    const bodyEl = document.getElementById('card-body');
    bodyEl.innerHTML = html;
    wireCardMedia(bodyEl);                        // 綁定照片／縮圖的 Lightbox
    cardEl.classList.toggle('propose', key==='propose');
    cardEl.classList.add('show');
    controls.autoRotate=false; hintEl.style.opacity=0;
    if(key==='propose'){
      forceDuskForPropose();   // 求婚：強制平滑切到黃昏並點燈
      revealRingBox();   // the moment of truth: he takes out the ring box
      wirePropose();
    }
  }
  // proposal begins: he changes into a suit and takes out the ring box
  function revealRingBox(){
    if(ringGiven) return;                       // already proposed & accepted
    if(me){
      me.userData.casual.visible=false;         // 脫下便服
      me.userData.formal.visible=true;          // 換上西裝
      ['box','lid','ringInBox'].forEach(k=>{ if(me.userData[k]) me.userData[k].visible=true; });
    }
  }
  function closeCard(){
    if(lightboxOpen){ closeLightbox(); return; }   // 燈箱開著時，先關燈箱
    cardEl.classList.remove('show'); controls.autoRotate=true;
    // if proposal was opened but not accepted, revert to casual + hide ring (keep surprise)
    if(!ringGiven && me){
      me.userData.casual.visible=true;
      me.userData.formal.visible=false;
      ['box','lid','ringInBox'].forEach(k=>{ if(me.userData[k]) me.userData[k].visible=false; });
      restoreDayNightAfterPropose();   // 未答應：平滑還原到進入前日夜狀態並熄燈
    }
  }
  cardEl.querySelector('.close').addEventListener('click', closeCard);
  addEventListener('keydown', e=>{
    if(e.key==='Escape'){ if(lightboxOpen) closeLightbox(); else closeCard(); }
    else if(lightboxOpen && e.key==='ArrowLeft')  lbStep(-1);
    else if(lightboxOpen && e.key==='ArrowRight') lbStep(1);
  });

  // ========================= propose =========================
  function wirePropose(){
    const btn=document.getElementById('yesBtn');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      document.getElementById('propose-actions').style.display='none';
      document.getElementById('propose-answer').style.display='block';
      confettiBurst();
      sfxPlay('propose');   // 求婚成功慶祝音效（缺檔靜默）
      proposeActive=true;
      giveRing();
    });
  }
  function giveRing(){
    if(ringGiven) return; ringGiven=true;
    // show ring on Wendy, show her bubble, remove groom's ring box
    if(wendyRing) wendyRing.visible=true;
    if(wendy) wendy.userData.bubble.visible=true;
    if(me){ ['box','lid','ringInBox'].forEach(k=>{ if(me.userData[k]) me.userData[k].visible=false; }); }
  }
  function confettiBurst(){
    const emojis=['💖','💍','🎉','💕','✨','💗'];
    for(let i=0;i<70;i++){
      const s=document.createElement('div'); s.textContent=emojis[i%emojis.length];
      s.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-40px;font-size:${18+Math.random()*22}px;z-index:40;pointer-events:none;transition:transform ${2+Math.random()*2}s linear, opacity 3s`;
      document.body.appendChild(s);
      requestAnimationFrame(()=>{ s.style.transform=`translateY(${100+Math.random()*20}vh) rotate(${Math.random()*720-360}deg)`; s.style.opacity='0'; });
      setTimeout(()=>s.remove(),4500);
    }
  }

  // ========================= 3D heart rain =========================
  const heartGeoShape=(()=>{ const sh=new THREE.Shape();
    sh.moveTo(0,0.5); sh.bezierCurveTo(0,0.9,-0.5,1.2,-0.9,0.7); sh.bezierCurveTo(-1.4,0.1,-0.5,-0.5,0,-1);
    sh.bezierCurveTo(0.5,-0.5,1.4,0.1,0.9,0.7); sh.bezierCurveTo(0.5,1.2,0,0.9,0,0.5);
    const g=new THREE.ExtrudeGeometry(sh,{depth:0.3,bevelEnabled:false}); g.center(); g.scale(0.4,0.4,0.4); return g; })();
  const rainHearts=[]; let rainInit=false;
  function initHeartRain(){
    const cols=[0xff5d8f,0xff8fab,0xffd166,0xffffff];
    for(let i=0;i<40;i++){ const m=new THREE.Mesh(heartGeoShape,flat(cols[i%cols.length]));
      m.position.set((Math.random()-0.5)*36,10+Math.random()*14,(Math.random()-0.5)*36);
      m.userData={vy:0.04+Math.random()*0.06,spin:(Math.random()-0.5)*0.1}; scene.add(m); rainHearts.push(m); }
    rainInit=true;
  }
  function heartRainStep(){
    if(!rainInit) initHeartRain();
    rainHearts.forEach(h=>{ h.position.y-=h.userData.vy*4; h.rotation.y+=h.userData.spin; h.rotation.z+=h.userData.spin*0.5;
      if(h.position.y<-2){ h.position.y=12+Math.random()*12; h.position.x=(Math.random()-0.5)*36; h.position.z=(Math.random()-0.5)*36; } });
  }

  // ========================= resize =========================
  addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  // ========================= 進場動畫（鏡頭從遠方海面低角度飛近主島）=========================
  const INTRO_VIEW = { pos:new THREE.Vector3(24,22,30), tgt:new THREE.Vector3(0,1.5,0) };
  let intro = null;
  function startIntro(){
    camera.position.set(76, 3.5, 68);              // 遠方、貼近海面、低角度
    controls.target.set(0, 1.5, 0);
    controls.enabled = false; controls.autoRotate = false;
    intro = { camFrom:camera.position.clone(), camTo:INTRO_VIEW.pos.clone(),
      tgtFrom:controls.target.clone(), tgtTo:INTRO_VIEW.tgt.clone(), t:0, dur:3.6 };
  }

  // ========================= animate =========================
  const clock = new THREE.Clock();
  let elapsed = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);   // 夾住大幀距，避免切背景分頁後跳動
    elapsed += dt;
    const t = elapsed;

    // ---- 日夜循環 ----
    if(dnTween){
      dnTween.t = Math.min(1, dnTween.t + dt/dnTween.dur);
      const e = 1-Math.pow(1-dnTween.t, 3);
      // 以最短路徑插值 phase
      let from=dnTween.from, to=dnTween.to, diff=to-from;
      if(diff> 0.5) diff-=1; if(diff<-0.5) diff+=1;
      dayNightPhase = ((from + diff*e) % 1 + 1) % 1;
      if(dnTween.t>=1){ if(dnTween.after) dnTween.after(); dnTween=null; }
    } else if(dnAuto){
      dayNightPhase = (dayNightPhase + dt/DN_CYCLE) % 1;
    }
    applyDayNightPhase(dayNightPhase);

    // 暖色點燈平滑亮/滅
    warmLights.forEach(l=>{ l.intensity += (l.userData.targetInt - l.intensity) * Math.min(1, dt*3); });

    // sea waves
    const pos=sea.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){ const ix=i*3; const x=seaBase[ix], y=seaBase[ix+1];
      pos.array[ix+2]=Math.sin(x*0.3+t*1.2)*0.25+Math.cos(y*0.3+t)*0.25; }
    pos.needsUpdate=true;

    island.position.y=Math.sin(t*0.8)*0.18;
    satellites.forEach(s=>{ s.group.position.y=s.baseY+Math.sin(t*0.7+s.phase)*0.3; });

    // Wendy + Me idle
    if(wendy){ wendy.position.y=wendy.userData.baseY+Math.sin(t*1.1)*0.1; wendy.rotation.y=0.4+Math.sin(t*0.5)*0.15; }
    if(me){ me.position.y=me.userData.baseY+Math.sin(t*1.1+1)*0.1; }

    // 進場飛行（優先於一般 flyTo）
    if(intro){
      intro.t = Math.min(1, intro.t + dt/intro.dur);
      const e = 1-Math.pow(1-intro.t, 3);
      camera.position.lerpVectors(intro.camFrom, intro.camTo, e);
      controls.target.lerpVectors(intro.tgtFrom, intro.tgtTo, e);
      if(intro.t>=1){ intro=null; controls.enabled=true; controls.autoRotate=true; }
    } else if(fly){ fly.t=Math.min(1,fly.t+0.02); const e=1-Math.pow(1-fly.t,3);
      camera.position.lerpVectors(fly.camFrom,fly.camTo,e); controls.target.lerpVectors(fly.tgtFrom,fly.tgtTo,e); if(fly.t>=1) fly=null; }

    if(proposeActive) heartRainStep();

    // landmarks bob + hover
    blocks.forEach(b=>{ b.position.y=b.userData.baseY+Math.sin(t*1.5+b.userData.phase)*0.15; b.rotation.y+=0.004;
      const target=(b===hovered)?1.18:1; b.scale.lerp(new THREE.Vector3(target,target,target),0.15); });

    // residents wander
    residents.forEach(r=>{ const u=r.userData; u.angle+=u.turn+0.004;
      const nx=r.position.x+Math.sin(u.angle)*u.speed*0.08, nz=r.position.z+Math.cos(u.angle)*u.speed*0.08;
      if(Math.hypot(nx,nz)<6.3){ r.position.x=nx; r.position.z=nz; } else { u.angle+=Math.PI; u.turn=(Math.random()-0.5)*0.02; }
      r.rotation.y=u.angle;
      r.position.y=u.baseY+Math.abs(Math.sin(t*4+u.phase))*0.12;
      const s=(r===hoveredCritter)?1.22:1; r.scale.lerp(new THREE.Vector3(s,s,s),0.18); });

    clouds.forEach((c,i)=>{ c.position.x+=0.01+i*0.003; if(c.position.x>30) c.position.x=-30; });

    // seagulls circle & flap
    birds.forEach(b=>{ const u=b.userData; u.ang+=u.spd;
      b.position.set(Math.cos(u.ang)*u.r, u.h+Math.sin(u.ang*2)*0.6, Math.sin(u.ang)*u.r);
      b.rotation.y=-u.ang;
      const flap=Math.sin(t*8+u.ang)*0.5; u.wL.rotation.z=Math.PI/2+flap; u.wR.rotation.z=-Math.PI/2-flap;
    });

    // family + friend folks: gentle sway + hover pop
    allFolks().forEach(f=>{
      const u=f.userData;
      f.position.y=u.baseY+Math.sin(t*2+u.phase)*0.06;
      f.rotation.z=Math.sin(t*1.5+u.phase)*0.03;
      const s=(f===hoveredFolk)?1.18:1; f.scale.lerp(new THREE.Vector3(s,s,s),0.18);
    });

    // 雲倒影跟著雲 x 移動
    cloudRefls.forEach(cr=>{ cr.mesh.position.x = cr.cloud.position.x; });

    // ---- 粒子更新 ----
    // 花瓣：緩降 + 左右搖擺，落到海面重置回高空
    const pp = petals.geometry.attributes.position;
    for(let i=0;i<PETAL_N;i++){
      const d=petalData[i];
      let y = pp.array[i*3+1] - d.fall*dt;
      let x = d.baseX + Math.sin(t*0.8 + d.swing)*d.swAmp;
      if(y < seaY){ y = 14+Math.random()*8; d.baseX=(Math.random()-0.5)*60; pp.array[i*3+2]=(Math.random()-0.5)*60; }
      pp.array[i*3]=x; pp.array[i*3+1]=y;
    }
    pp.needsUpdate = true;
    // 螢火蟲：緩慢遊走 + 明滅（明滅用整體 opacity 的夜晚因子已在日夜回呼處理，這裡做位置遊走與個別微閃）
    if(flyMat.opacity > 0.01){
      const fp = fireflies.geometry.attributes.position;
      for(let i=0;i<FLY_N;i++){
        const d=flyData[i];
        fp.array[i*3]   = d.cx + Math.sin(t*0.4 + d.drift)*d.dr;
        fp.array[i*3+1] = d.cy + Math.sin(t*0.6 + d.phase)*0.6;
        fp.array[i*3+2] = d.cz + Math.cos(t*0.4 + d.drift)*d.dr;
      }
      fp.needsUpdate = true;
    }
    // 海面反光：整體閃爍（size 呼吸）
    sparkMat.size = 0.5 + Math.abs(Math.sin(t*2))*0.4;

    controls.update(); renderer.render(scene, camera);
  }
  animate();

  startIntro();                                   // 一開始就定位到遠方起點，進場飛行
  setTimeout(()=> loaderEl.classList.add('hide'), 500);
  setTimeout(()=>{ hintEl.style.opacity=0; }, 10000);
  </script>
</body>
</html>
