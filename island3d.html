<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wendy 島 3D｜寶寶・我的女朋友</title>
<style>
  :root{
    --coral:#ff5d8f;
    --sea-deep:#2a6f97;
    --ink:#2b2d42;
    --cream:#fffaf3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #loader{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:linear-gradient(180deg,#caf0f8,#a9d6e5);color:var(--sea-deep);
    transition:opacity .6s;
  }
  #loader.hide{opacity:0;pointer-events:none}
  .spin{width:54px;height:54px;border:6px solid #fff;border-top-color:var(--coral);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  #title{position:fixed;top:22px;left:0;width:100%;text-align:center;z-index:10;pointer-events:none}
  #title h1{font-size:clamp(2rem,7vw,3.4rem);color:#fff;letter-spacing:2px;text-shadow:0 3px 0 var(--coral),0 8px 20px rgba(42,111,151,.4)}
  #title p{margin-top:8px;font-size:clamp(.85rem,3vw,1.1rem);color:var(--sea-deep);display:inline-block;background:rgba(255,255,255,.7);padding:6px 18px;border-radius:999px}
  #title p b{color:var(--coral)}

  #hint{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(255,255,255,.82);color:var(--sea-deep);padding:9px 20px;border-radius:999px;
    font-size:.9rem;box-shadow:0 6px 18px rgba(42,111,151,.25);text-align:center;max-width:92vw;
    transition:opacity .5s;
  }

  #card{
    position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
    width:min(440px,90vw);max-height:82vh;overflow:auto;background:var(--cream);
    border-radius:24px;padding:28px 26px 26px;box-shadow:0 24px 60px rgba(42,111,151,.4);
    border:4px solid #fff;opacity:0;pointer-events:none;transition:all .3s;
  }
  #card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #card .close{position:absolute;top:12px;right:16px;font-size:26px;cursor:pointer;color:#bbb;border:none;background:none}
  #card .close:hover{color:var(--coral)}
  #card .ic{font-size:50px;text-align:center}
  #card h2{text-align:center;color:var(--coral);margin:8px 0 16px;font-size:1.6rem}
  #card .body{color:#55707f;line-height:1.75;font-size:1.02rem}
  #card .body .row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #ffe0ea}
  #card .body .row:last-child{border-bottom:none}
  #card .body .row .k{font-size:28px;flex:0 0 auto}
  #card .body .row .v b{color:var(--coral)}
  #card .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  #card .chip{background:#fff0f5;color:var(--coral);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.95rem}
  #card .group-title{font-weight:800;color:var(--sea-deep);margin:14px 0 6px;font-size:1.05rem}
  #card .photo{width:100%;border-radius:16px;margin:10px 0 4px;box-shadow:0 8px 22px rgba(42,111,151,.28);border:3px solid #fff;display:block}
  #card .photo-cap{text-align:center;color:#7a95a3;font-size:.9rem;margin-bottom:6px}

  /* propose card */
  #card.propose{border-color:#ff8fab;box-shadow:0 24px 70px rgba(255,93,143,.5);background:linear-gradient(180deg,#fffaf3,#fff0f5)}
  #card.propose h2{font-size:1.8rem;background:linear-gradient(90deg,#ff5d8f,#ff8fab);-webkit-background-clip:text;background-clip:text;color:transparent;animation:beat 1.6s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.06)}}
  #yesBtn{font-size:1.25rem;font-weight:800;color:#fff;cursor:pointer;border:none;padding:14px 42px;border-radius:999px;
    background:linear-gradient(90deg,#ff5d8f,#ff8fab);box-shadow:0 10px 24px rgba(255,93,143,.5);transition:transform .2s;animation:beat 1.4s infinite}
  #yesBtn:hover{transform:scale(1.08)}
  #yesBtn:active{transform:scale(.96)}

  #back2d{
    position:fixed;top:18px;right:18px;z-index:10;background:rgba(255,255,255,.85);
    color:var(--sea-deep);text-decoration:none;padding:8px 16px;border-radius:999px;
    font-size:.88rem;font-weight:700;box-shadow:0 6px 16px rgba(42,111,151,.25);
  }
  #back2d:hover{background:#fff}

  #dayNightBtn{
    position:fixed;top:60px;right:18px;z-index:10;background:rgba(255,255,255,.85);
    color:var(--sea-deep);border:none;cursor:pointer;padding:8px 16px;border-radius:999px;
    font-size:.88rem;font-weight:700;box-shadow:0 6px 16px rgba(42,111,151,.25);
    font-family:inherit;
  }
  #dayNightBtn:hover{background:#fff}

  #bgmBtn{
    position:fixed;top:102px;right:18px;z-index:10;background:rgba(255,255,255,.85);
    color:var(--sea-deep);border:none;cursor:pointer;padding:8px 16px;border-radius:999px;
    font-size:.88rem;font-weight:700;box-shadow:0 6px 16px rgba(42,111,151,.25);
    font-family:inherit;
  }
  #bgmBtn:hover{background:#fff}

  /* ---- 旅行島相簿 ---- */
  .trip-album{padding:10px 0;border-bottom:1px dashed #ffe0ea}
  .trip-album:last-child{border-bottom:none}
  .trip-head{font-size:1.1rem;color:var(--sea-deep)}
  .trip-head .trip-flag{font-size:1.4rem;margin-right:6px}
  .trip-note{color:#6b7b86;line-height:1.7;margin:4px 0 8px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px}
  .thumb{width:84px;height:84px;object-fit:cover;border-radius:12px;border:3px solid #fff;
    box-shadow:0 6px 16px rgba(42,111,151,.22);cursor:pointer;transition:transform .2s}
  .thumb:hover{transform:scale(1.06)}
  .photo-ph{background:#fff0f5;color:#b58aa0;border-radius:12px;padding:16px;text-align:center;font-size:.92rem}
  /* ---- 旅行景點投影片輪播 ---- */
  .slideshow{position:relative;border-radius:14px;overflow:hidden;border:3px solid #fff;
    box-shadow:0 8px 22px rgba(42,111,151,.25);background:#fff0f5}
  .slideshow .slides{position:relative;width:100%;aspect-ratio:4/3}
  .slideshow .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .6s;cursor:zoom-in}
  .slideshow .slide.on{opacity:1}
  .slideshow .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;
    border:none;border-radius:50%;background:rgba(255,255,255,.82);color:var(--sea-deep);
    font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(42,111,151,.3)}
  .slideshow .nav:hover{background:#fff}
  .slideshow .prev{left:8px}.slideshow .next{right:8px}
  .slideshow .dots{position:absolute;bottom:8px;left:0;width:100%;display:flex;gap:6px;
    justify-content:center}
  .slideshow .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}
  .slideshow .dot.on{background:#fff}
  .slideshow .count{position:absolute;top:8px;right:10px;background:rgba(20,28,38,.5);color:#fff;
    font-size:.78rem;padding:2px 8px;border-radius:999px}
  #card .photo{cursor:zoom-in}

  /* ---- 照片燈箱 Lightbox ---- */
  #lightbox{
    position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(20,28,38,.82);opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #lightbox.show{opacity:1;pointer-events:auto}
  #lightbox img{
    max-width:88vw;max-height:80vh;border-radius:18px;border:4px solid #fff;
    box-shadow:0 24px 70px rgba(0,0,0,.5);background:#fff;
  }
  #lightbox .lb-close{position:absolute;top:18px;right:22px;font-size:34px;line-height:1;color:#fff;
    background:none;border:none;cursor:pointer;opacity:.85}
  #lightbox .lb-close:hover{opacity:1}
  #lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;line-height:1;
    color:#fff;background:rgba(255,255,255,.18);border:none;cursor:pointer;width:54px;height:54px;
    border-radius:50%;opacity:.9;user-select:none}
  #lightbox .lb-nav:hover{background:rgba(255,255,255,.3)}
  #lightbox .lb-nav[disabled]{opacity:.25;cursor:default}
  #lightbox .lb-prev{left:16px}
  #lightbox .lb-next{right:16px}
  #lightbox .lb-count{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    color:#fff;background:rgba(0,0,0,.4);padding:6px 16px;border-radius:999px;font-size:.9rem;font-weight:700}
</style>
</head>
<body>
  <div id="app"></div>

  <div id="loader">
    <div class="spin"></div>
    <div>正在組合 Wendy 島…</div>
  </div>

  <div id="title">
    <h1>Wendy 島</h1>
    <p>暱稱 <b>寶寶</b> ・ 我的女朋友 ・ <b>讓人又愛又恨</b> 😤❤️</p>
  </div>

  <a id="back2d" href="index.html?stay=1">← 2D 版</a>
  <button id="dayNightBtn" title="切換日夜模式">🔄 自動</button>
  <button id="bgmBtn" title="背景音樂開關">🔇 音樂</button>

  <div id="hint">🖱️ 拖曳旋轉 ・ 滾輪縮放 ・ 點島上的人物與周邊小島，認識 Wendy 這個人　🌗 右上可切換白天／黃昏／夜晚</div>

  <div id="card">
    <button class="close" aria-label="close">×</button>
    <div class="ic" id="card-ic">💖</div>
    <h2 id="card-title">標題</h2>
    <div class="body" id="card-body"></div>
  </div>

  <!-- 照片燈箱（通用元件，家人/好友/求婚/旅行島共用） -->
  <div id="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="關閉">×</button>
    <button class="lb-nav lb-prev" aria-label="上一張">‹</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-nav lb-next" aria-label="下一張">›</button>
    <div class="lb-count" id="lb-count"></div>
  </div>

  <!-- 資料外置：classic script，確保早於 module 執行，window.ISLAND_DATA 可用 -->
  <script src="data.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const loaderEl = document.getElementById('loader');
  const hintEl = document.getElementById('hint');

  // ========================= 外置資料（data.js）防呆讀取 =========================
  const D = window.ISLAND_DATA || {};
  const animalsData = Array.isArray(D.animals) ? D.animals : [];
  const familyData  = Array.isArray(D.family)  ? D.family  : [];
  const friendsData = Array.isArray(D.friends) ? D.friends : [];
  const tripsData   = Array.isArray(D.trips)   ? D.trips   : [];
  const disneyFolksData = Array.isArray(D.disneyFolks) ? D.disneyFolks : [];
  const photosData  = D.photos || {};
  const audioData   = D.audio  || {};

  // ========================= scene =========================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe9f5);
  scene.fog = new THREE.Fog(0xbfe9f5, 60, 150);

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
  camera.position.set(24, 22, 30);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.getElementById('app').appendChild(renderer.domElement);

  let fly = null;
  let proposeActive = false;
  let ringGiven = false;

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 6;
  controls.maxDistance = 80;
  controls.maxPolarAngle = Math.PI/2.15;
  controls.target.set(0, 1.5, 0);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  // ========================= lights =========================
  const hemi = new THREE.HemisphereLight(0xfff4e6, 0x9ad0e5, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d8, 1.15);
  sun.position.set(18, 28, 16);
  sun.castShadow = true;
  // L1 精緻化：陰影貼圖 2048→4096，陰影邊緣更細（桌機明顯）；若低階裝置效能吃緊可調回 2048
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
  sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
  sun.shadow.camera.far = 90;
  sun.shadow.bias = -0.0004;
  sun.shadow.radius = 3;   // L1：柔邊半徑 4→3，陰影略為銳利不過糊
  scene.add(sun);
  // soft fill light from opposite side so shadows aren't dead-black
  const fill = new THREE.DirectionalLight(0xbfe0ff, 0.35);
  fill.position.set(-16, 12, -14);
  scene.add(fill);

  // ========================= 日夜循環系統 =========================
  // 三個 preset：白天（現況藍天）／黃昏（橘粉金、低太陽長影）／夜晚（深藍紫、星空、弱光）
  const DAY = {
    bg:0xbfe9f5, fog:0xbfe9f5,
    hemiSky:0xfff4e6, hemiGround:0x9ad0e5, hemiInt:0.85,
    sunColor:0xfff0d8, sunInt:1.15, sunPos:new THREE.Vector3(18,28,16),
    fillColor:0xbfe0ff, fillInt:0.35,
    exposure:1.05, stars:0.0,
    sea:0x4ba3c7, reflDim:0.18
  };
  const DUSK = {
    bg:0xffb27a, fog:0xffa06b,
    hemiSky:0xffd9a0, hemiGround:0xb08a6a, hemiInt:0.7,
    sunColor:0xff8a4c, sunInt:1.0, sunPos:new THREE.Vector3(26,8,10),
    fillColor:0xffb27a, fillInt:0.4,
    exposure:1.1, stars:0.15,
    sea:0xd98a5a, reflDim:0.22
  };
  const NIGHT = {
    // 月夜：提高環境光底線，避免整座島全黑（仍保留夜晚偏藍的氛圍）
    bg:0x222a56, fog:0x2b3360,
    hemiSky:0x5a6ba8, hemiGround:0x242a56, hemiInt:0.72,
    sunColor:0x9fb0e0, sunInt:0.55, sunPos:new THREE.Vector3(-18,20,-14),   // 當作月光，角度拉高一點
    fillColor:0x6a78b0, fillInt:0.42,
    exposure:1.02, stars:1.0,
    sea:0x273566, reflDim:0.14
  };

  // 星空（夜晚顯示），約 420 點
  let starPoints;
  (function buildStars(){
    const N=420, arr=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      // 分佈於天空半球外圈
      const r=120+Math.random()*60;
      const theta=Math.random()*Math.PI*2;
      const phi=Math.random()*Math.PI*0.5;          // 上半球
      arr[i*3]   = Math.cos(theta)*Math.sin(phi)*r;
      arr[i*3+1] = Math.cos(phi)*r*0.9 + 10;
      arr[i*3+2] = Math.sin(theta)*Math.sin(phi)*r;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(arr,3));
    const mat=new THREE.PointsMaterial({ color:0xfffbe0, size:1.4, sizeAttenuation:false,
      transparent:true, opacity:0, depthWrite:false });
    starPoints=new THREE.Points(geo,mat);
    starPoints.renderOrder=-1;
    scene.add(starPoints);
  })();

  const _cA=new THREE.Color(), _cB=new THREE.Color();
  function lerpColorHex(a,b,k,out){ _cA.setHex(a); _cB.setHex(b); out.copy(_cA).lerp(_cB,k); }
  const _lerp=(a,b,k)=>a+(b-a)*k;

  // reflection / sea 回呼（由第 5 項倒影系統註冊）
  let dayNightHooks = [];

  function applyPreset(a, b, k){
    lerpColorHex(a.bg, b.bg, k, scene.background);
    if(scene.fog) lerpColorHex(a.fog, b.fog, k, scene.fog.color);
    lerpColorHex(a.hemiSky, b.hemiSky, k, hemi.color);
    lerpColorHex(a.hemiGround, b.hemiGround, k, hemi.groundColor);
    hemi.intensity = _lerp(a.hemiInt, b.hemiInt, k);
    lerpColorHex(a.sunColor, b.sunColor, k, sun.color);
    sun.intensity = _lerp(a.sunInt, b.sunInt, k);
    sun.position.lerpVectors(a.sunPos, b.sunPos, k);
    lerpColorHex(a.fillColor, b.fillColor, k, fill.color);
    fill.intensity = _lerp(a.fillInt, b.fillInt, k);
    renderer.toneMappingExposure = _lerp(a.exposure, b.exposure, k);
    if(starPoints) starPoints.material.opacity = _lerp(a.stars, b.stars, k);
    const seaCol = _cA.clone(); lerpColorHex(a.sea, b.sea, k, seaCol);
    const reflDim = _lerp(a.reflDim, b.reflDim, k);
    dayNightHooks.forEach(fn => fn(seaCol, reflDim, k, a, b));
  }

  // 由 phase(0..1) 計算目前日夜狀態並套用
  //  0.00..0.33 日→黃昏；0.33..0.66 黃昏→夜；0.66..1 夜→日
  function applyDayNightPhase(phase){
    const p = ((phase % 1) + 1) % 1;
    if(p < 1/3)      applyPreset(DAY,  DUSK,  p/(1/3));
    else if(p < 2/3) applyPreset(DUSK, NIGHT, (p-1/3)/(1/3));
    else             applyPreset(NIGHT,DAY,   (p-2/3)/(1/3));
  }

  // 日夜狀態
  const DN_CYCLE = 150;              // 一圈約 2.5 分鐘
  let dayNightPhase = 0;             // 從白天開始
  let dnAuto = true;                 // 自動循環
  let dnTween = null;                // 平滑過渡 {from,to,t,dur,after}
  // 手動模式輪替：自動 → 白天 → 黃昏 → 夜晚 → 自動
  const DN_MODES = [
    { label:'🔄 自動', auto:true,  phase:null },
    { label:'☀️ 白天', auto:false, phase:0.0 },
    { label:'🌇 黃昏', auto:false, phase:1/3 },
    { label:'🌙 夜晚', auto:false, phase:2/3 }
  ];
  let dnModeIdx = 0;
  const dayNightBtn = document.getElementById('dayNightBtn');
  function startDnTween(toPhase, dur, after){
    dnTween = { from:dayNightPhase, to:toPhase, t:0, dur:dur||1.2, after:after||null };
  }
  dayNightBtn.addEventListener('click', ()=>{
    dnModeIdx = (dnModeIdx + 1) % DN_MODES.length;
    const m = DN_MODES[dnModeIdx];
    dayNightBtn.textContent = m.label;
    dnAuto = m.auto;
    if(!m.auto) startDnTween(m.phase, 1.0);
  });

  // 求婚聯動：強制平滑切到黃昏 + 點燈；關卡未答應再還原
  let proposeForcedDusk = false;
  let dnSaved = null;
  function forceDuskForPropose(){
    if(!proposeForcedDusk){
      dnSaved = { phase:dayNightPhase, auto:dnAuto, modeIdx:dnModeIdx };
    }
    proposeForcedDusk = true;
    dnAuto = false;
    setWarmLights(true);
    startDnTween(1/3, 1.6);          // 平滑切到黃昏
  }
  function restoreDayNightAfterPropose(){
    if(!proposeForcedDusk) return;
    proposeForcedDusk = false;
    setWarmLights(false);
    if(dnSaved){
      dnAuto = dnSaved.auto; dnModeIdx = dnSaved.modeIdx;
      dayNightBtn.textContent = DN_MODES[dnModeIdx].label;
      startDnTween(dnSaved.phase, 1.6);
    }
    dnSaved = null;
  }
  // 暖色點燈（家人島/好友島/營火）—— 物件於下方倒影/島嶼建立後註冊
  const warmLights = [];
  function setWarmLights(on){ warmLights.forEach(l=> l.userData.targetInt = on ? l.userData.onInt : 0); }

  // flat-shaded material (low-poly facets) — keep for terrain/foliage
  const flat = (c) => new THREE.MeshStandardMaterial({ color:c, flatShading:true, roughness:.9, metalness:0 });
  // smooth material (rounded, soft) — for characters & animals
  const soft = (c, rough=0.75) => new THREE.MeshStandardMaterial({ color:c, flatShading:false, roughness:rough, metalness:0 });

  // ========================= sea =========================
  const seaGeo = new THREE.PlaneGeometry(240, 240, 90, 90);
  const seaMat = new THREE.MeshStandardMaterial({ color:0x4ba3c7, flatShading:true, roughness:.6, transparent:true, opacity:.95 });
  const sea = new THREE.Mesh(seaGeo, seaMat);

  // 迪士尼島地標：通用童話城堡（原創風格，夢幻粉白牆 + 淺藍 + 金頂尖塔）
  // 回傳 group 作為該島 landmark；風格沿用 flat()/soft() 低多邊形材質。
  function buildCastle(){
    const g = new THREE.Group();
    const wall=0xfef2f6, wallTrim=0xe9cfe0, roof=0xffd56b, roofHi=0xffe79a, blue=0xbfe3ff, door=0x9c6fb0, flagCol=0xff8fab;
    // 單座尖塔 helper：圓柱塔身 + 圓錐金頂 + 小旗
    function tower(x, z, r, hBody, hRoof, withFlag){
      const t=new THREE.Group();
      const shaft=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.05,hBody,14),flat(wall)); shaft.position.y=hBody/2; shaft.castShadow=true; t.add(shaft);
      // 塔身繞一圈的小窗
      for(let i=0;i<4;i++){const a=i*(Math.PI/2); const w=new THREE.Mesh(new THREE.BoxGeometry(r*0.5,r*0.9,0.08),flat(blue)); w.position.set(Math.cos(a)*r*0.98, hBody*0.6, Math.sin(a)*r*0.98); w.rotation.y=-a; t.add(w);}
      const cone=new THREE.Mesh(new THREE.ConeGeometry(r*1.25,hRoof,14),flat(roof)); cone.position.y=hBody+hRoof/2; cone.castShadow=true; t.add(cone);
      const ring=new THREE.Mesh(new THREE.TorusGeometry(r*1.05,r*0.12,8,16),flat(roofHi)); ring.rotation.x=Math.PI/2; ring.position.y=hBody+0.02; t.add(ring);
      if(withFlag){
        const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.5,6),flat(0xdddddd)); pole.position.y=hBody+hRoof+0.2; t.add(pole);
        const flag=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.22,0.03),flat(flagCol)); flag.position.set(0.22,hBody+hRoof+0.32,0); t.add(flag);
      } else {
        const ball=new THREE.Mesh(new THREE.SphereGeometry(r*0.18,10,10),flat(roofHi)); ball.position.y=hBody+hRoof+0.1; t.add(ball);
      }
      t.position.set(x,0,z);
      return t;
    }
    // 主體基座（城牆）
    const base=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.4,1.6),flat(wall)); base.position.y=0.7; base.castShadow=true; g.add(base);
    // 城垛（基座頂一圈小方塊）
    for(let i=-2;i<=2;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.28,0.28),flat(wallTrim)); m.position.set(i*0.5,1.5,0.72); g.add(m);
      const m2=m.clone(); m2.position.z=-0.72; g.add(m2);}
    // 拱門（門洞 + 半圓拱）
    const arch=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.75,0.2),flat(door)); arch.position.set(0,0.5,0.82); g.add(arch);
    const archTop=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.2,12,1,false,0,Math.PI),flat(door)); archTop.rotation.x=Math.PI/2; archTop.rotation.z=Math.PI; archTop.position.set(0,0.88,0.82); g.add(archTop);
    // 中央主塔（最高、帶旗）
    g.add(tower(0, -0.1, 0.55, 2.4, 1.4, true));
    // 兩側小塔
    g.add(tower(-1.0, 0.1, 0.38, 1.7, 1.0, false));
    g.add(tower( 1.0, 0.1, 0.38, 1.7, 1.0, false));
    // 前方兩座門塔（較矮、帶旗）
    g.add(tower(-0.75, 0.75, 0.3, 1.3, 0.8, true));
    g.add(tower( 0.75, 0.75, 0.3, 1.3, 0.8, true));
    return g;
  }

  // 旋轉木馬：圓形條紋頂篷 + 中柱 + 幾匹小木馬；group.userData.spin 旗標讓 animate() 轉動。
  function buildCarousel(){
    const g = new THREE.Group();
    const poleCol=0xf6e3b0, roofA=0xff8fab, roofB=0xfff4f8, horseCols=[0xfff2d6,0xcfe8ff,0xffe0ec];
    // 底座圓盤
    const deck=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.2,0.16,20),flat(0xf3d9e4)); deck.position.y=0.08; deck.castShadow=true; g.add(deck);
    // 中柱
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.16,1.7,12),flat(poleCol)); pole.position.y=0.95; pole.castShadow=true; g.add(pole);
    // 轉動部分（木馬 + 頂篷一起轉）
    const spinner=new THREE.Group(); spinner.position.y=0; g.add(spinner);
    // 條紋頂篷（錐形 + 交錯色片近似條紋）
    const canopy=new THREE.Mesh(new THREE.ConeGeometry(1.25,0.7,16),flat(roofB)); canopy.position.y=1.95; canopy.castShadow=true; spinner.add(canopy);
    for(let i=0;i<8;i++){const a=i*(Math.PI*2/8); const stripe=new THREE.Mesh(new THREE.ConeGeometry(0.16,0.72,6),flat(i%2?roofA:roofB)); stripe.position.set(Math.cos(a)*0.62,1.95,Math.sin(a)*0.62); stripe.scale.set(1,1,0.3); spinner.add(stripe);}
    const topBall=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,12),flat(0xffd56b)); topBall.position.y=2.4; spinner.add(topBall);
    // 木馬（繞中柱懸掛）
    for(let i=0;i<4;i++){
      const a=i*(Math.PI*2/4);
      const arm=new THREE.Group(); arm.rotation.y=a;
      const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.0,6),flat(0xdcc38a)); bar.position.set(0.9,1.3,0); spinner.add(bar);
      // 小木馬：身體 + 頭 + 腿（低多邊形）
      const horse=new THREE.Group();
      const col=horseCols[i%horseCols.length];
      const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.16,0.3,6,10),soft(col)); body.rotation.z=Math.PI/2; body.position.y=0.78; horse.add(body);
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.12,12,12),soft(col)); head.scale.set(1,1.1,1.3); head.position.set(0.22,0.95,0); horse.add(head);
      const mane=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.18,8),soft(0xff8fab)); mane.position.set(0.1,1.02,0); mane.rotation.z=-0.5; horse.add(mane);
      [[-0.12,-1],[0.12,-1],[-0.12,1],[0.12,1]].forEach(p=>{const l=new THREE.Mesh(new THREE.CapsuleGeometry(0.035,0.2,4,6),soft(col)); l.position.set(p[0],0.6,p[1]*0.1); horse.add(l);});
      horse.position.set(0.9,0,0); arm.add(horse);
      spinner.add(arm);
    }
    g.userData.spinner = spinner;   // animate() 依此旋轉
    return g;
  }

  // 迪士尼島圓耳朵吉祥物小人（原創致敬風格）：圓身 + 兩個圓耳朵 + 肚皮 + 笑臉
  // 回傳 group；hover 泡泡與島上遊走由 disneyPals 更新模式接上。
  function makeMascot(opt){
    const g = new THREE.Group();
    const body = opt.body||0x7cc4f0, ears = opt.ears||0x4a6fd8, belly = opt.belly||0xffffff;
    // 腳
    [[-0.12],[0.12]].forEach(p=>{const ft=new THREE.Mesh(new THREE.CapsuleGeometry(0.08,0.1,6,8),soft(ears)); ft.rotation.z=Math.PI/2; ft.position.set(p[0],0.1,0.08); ft.castShadow=true; g.add(ft);});
    // 圓身
    const torso=new THREE.Mesh(new THREE.SphereGeometry(0.34,16,16),soft(body)); torso.scale.set(1,1.1,0.95); torso.position.y=0.56; torso.castShadow=true; g.add(torso);
    const bellyM=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,16),soft(belly)); bellyM.scale.set(1,1.05,0.6); bellyM.position.set(0,0.52,0.24); g.add(bellyM);
    // 手臂
    [[-1],[1]].forEach(p=>{const a=new THREE.Mesh(new THREE.CapsuleGeometry(0.07,0.22,6,8),soft(body)); a.position.set(p[0]*0.34,0.6,0); a.rotation.z=p[0]*0.6; g.add(a);
      const hd=new THREE.Mesh(new THREE.SphereGeometry(0.08,10,10),soft(belly)); hd.position.set(p[0]*0.5,0.44,0); g.add(hd);});
    // 頭
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.32,16,16),soft(body)); head.position.y=1.08; head.castShadow=true; g.add(head);
    // 兩個圓耳朵（自創配色，用 ears 色）
    [[-0.26],[0.26]].forEach(p=>{const ear=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,16),soft(ears)); ear.position.set(p[0],1.34,-0.02); ear.castShadow=true; g.add(ear);});
    // 臉：眼睛 + 笑嘴
    [[-0.11],[0.11]].forEach(p=>{const e=eyeBall(0.055); e.position.set(p[0],1.12,0.28); g.add(e);});
    const nose=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),soft(0x2b2d42)); nose.position.set(0,1.04,0.31); g.add(nose);
    const smile=new THREE.Mesh(new THREE.TorusGeometry(0.08,0.02,8,12,Math.PI),soft(0x6b4a3a)); smile.position.set(0,0.98,0.29); smile.rotation.z=Math.PI; g.add(smile);
    // 腮紅
    [[-0.2],[0.2]].forEach(p=>{const b=new THREE.Mesh(new THREE.SphereGeometry(0.06,10,10),soft(0xffb0c4)); b.position.set(p[0],1.02,0.24); b.scale.set(1,0.7,0.4); g.add(b);});
    return g;
  }

  // ========================= satellite islands + bridges =========================
  const satellites = [];
  const blocks = [];

  function buildSatelliteIsland(wx, wz, tint, r=3.9){
    const g = new THREE.Group();
    // L1：衛星島圓柱 radialSegments 由 8/9 提到 12/14，島緣更圓（保留 flatShading 地貌風格）
    const sand = new THREE.Mesh(new THREE.CylinderGeometry(r*0.85, r, 1.4, 14), flat(0xffe0b3));
    sand.position.y = 0; sand.castShadow = sand.receiveShadow = true; g.add(sand);
    const dirt = new THREE.Mesh(new THREE.CylinderGeometry(r*0.7, 0.8, 3, 12), flat(0xb5835a));
    dirt.position.y = -2.1; g.add(dirt);
    const grass = new THREE.Mesh(new THREE.CylinderGeometry(r*0.72, r*0.88, 0.8, 14), flat(tint||0x8cd17d));
    grass.position.y = 0.9; grass.castShadow = grass.receiveShadow = true; g.add(grass);
    palm(r*0.5, r*0.4, 0.7, g);
    // a few flowers & grass tufts around the rim (ground top ~1.3)
    const gt = 1.3, rr = r*0.55;
    for(let i=0;i<5;i++){ const a=i*(Math.PI*2/5)+Math.random();
      flower(Math.cos(a)*rr, Math.sin(a)*rr, g, flowerCols[i%flowerCols.length], gt); }
    for(let i=0;i<4;i++){ const a=i*(Math.PI*2/4)+0.6;
      grassTuft(Math.cos(a)*rr*0.8, Math.sin(a)*rr*0.8, g, gt); }
    g.position.set(wx, 0.6, wz); scene.add(g);
    satellites.push({ group:g, phase:Math.random()*Math.PI*2, baseY:0.6 });
    return g;
  }

  // wooden bridge from main island edge toward a satellite
  function buildBridge(wx, wz, satR=3.4){
    const g = new THREE.Group();
    const dir = new THREE.Vector2(wx, wz).normalize();
    const start = 8.5;                                // main island edge
    const end = Math.hypot(wx,wz) - satR;             // satellite edge
    const len = end - start;
    const planks = Math.max(4, Math.floor(len/0.8));
    const angle = Math.atan2(wz, wx);
    for(let i=0;i<planks;i++){
      const d = start + (i+0.5)*(len/planks);
      const plank = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.14,1.2), flat(i%2?0xc99a66:0xb5835a));
      plank.position.set(dir.x*d, 1.55 + Math.sin(i*0.6)*0.05, dir.y*d);
      plank.rotation.y = -angle;
      plank.castShadow = true; g.add(plank);
    }
    // rope rails
    [-0.55,0.55].forEach(off=>{
      const rope = new THREE.Mesh(new THREE.BoxGeometry(len,0.05,0.05), flat(0xe8c39e));
      rope.position.set(dir.x*(start+len/2), 1.95, dir.y*(start+len/2));
      rope.rotation.y = -angle;
      rope.translateZ(off); g.add(rope);
    });
    scene.add(g);
  }

  function registerBlock(key, group, wx, wz, label, labelY, hitSize, tint){
    const isle = buildSatelliteIsland(wx, wz, tint);
    buildBridge(wx, wz);
    const hit = new THREE.Mesh(new THREE.BoxGeometry(hitSize,hitSize,hitSize), new THREE.MeshBasicMaterial({visible:false}));
    hit.position.y = hitSize/2; group.add(hit);
    group.add(textLabel(label, labelY));
    group.position.set(0, 1.3, 0); isle.add(group);
    group.userData = { key, baseY:1.3, phase:Math.random()*Math.PI*2, cube:hit, focus:new THREE.Vector3(wx,2,wz) };
    blocks.push(group);
    return isle;
  }

  // bigger satellite (custom radius) — used for family island
  function registerBlockBig(key, group, wx, wz, label, labelY, hitSize, tint, r){
    const isle = buildSatelliteIsland(wx, wz, tint, r);

    blocks.push(group);
    return isle;
  }

  // 5 satellites around the main island
  registerBlock('personality', buildHeart(),       0, -17, '個性島', 3.2, 2.8, 0xffc2d1);

  //   城堡作為 landmark（點它開 'disney' 卡片；夜晚額外放煙火）。tint 給夢幻粉紫色系。
  const disneyIsle = registerBlockBig('disney', buildCastle(), -19, -19, '迪士尼島', 4.2, 3.4, 0xf3c6e8, 6.0);

  // 旋轉木馬：放在城堡旁（島上座標偏右前，不擋城堡）；島上地面 top≈1.3。

  // 迪士尼島圓耳朵吉祥物小人（依 data.js 的 disneyFolks 生成；hover 冒泡泡、島上輕輕遊走）

  // 暖色點燈：家人島、好友島（營火旁）各放一顆節制的 PointLight（求婚/夜晚才亮）
  function addWarmLight(wx, wz, color, range, onInt, y){
    const pl = new THREE.PointLight(color||0xffb066, 0, range||16, 2);
    pl.position.set(wx, y||4, wz);
    pl.userData = { onInt:(onInt||1.4), targetInt:0 };

  }
  addWarmLight(0, 0, 0xffc488, 26, 2.0, 6);   // 主島（整體暖光，範圍大、夜晚點亮）
  addWarmLight(19, 19, 0xffb066, 18, 1.6);    // 家人島

  addWarmLight(-19, -19, 0xffd0f0, 20, 1.5, 6); // 迪士尼島（城堡夢幻暖光）

  // ========================= 水面倒影（輕量：鏡像半透明代理，非 Reflector）=========================
  const seaY = sea.position.y;                     // -0.4
  const reflMat = new THREE.MeshBasicMaterial({
    color:0x6fb6d0, transparent:true, opacity:0.18, depthWrite:false, side:THREE.DoubleSide
  });
  const reflGroup = new THREE.Group();
  scene.add(reflGroup);
  // 主島輪廓倒影（用簡化錐體近似，省效能）
  function addReflBlob(x, z, r, h){
    const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), reflMat);
    // 鏡像：尖端朝下（scale.y=-1 的效果），放在海面下

  addReflBlob(0, 0, 9, 5);                          // 主島

  // 雲的倒影（跟著雲 x 移動）

  clouds.forEach(c=>{

    m.position.set(c.position.x, seaY + 0.05, c.position.z);
    reflGroup.add(m); cloudRefls.push({ mesh:m, cloud:c });
  });

  // 註冊日夜回呼：海面顏色 + 倒影色調/強度隨日夜變化
  dayNightHooks.push((seaCol, reflDim)=>{
    seaMat.color.copy(seaCol);
    reflMat.color.copy(seaCol).lerp(new THREE.Color(0xffffff), 0.25);
    reflMat.opacity = reflDim;
  });

  // 註冊日夜回呼：暖色點燈隨「夜晚程度」自動亮起（黃昏開始漸亮、深夜最亮、白天熄滅）
  // 求婚強制點燈時（proposeForcedDusk）交由 setWarmLights 控制，這裡不覆蓋。
  dayNightHooks.push(()=>{
    if(proposeForcedDusk) return;                 // 求婚點燈優先，別搶控制
    const p = ((dayNightPhase % 1)+1)%1;
    // 夜晚程度：phase 2/3 附近最暗（與粒子一致）；黃昏(1/3)就開始帶一點暖光
    const nightF = Math.max(0, 1 - Math.min(Math.abs(p-2/3), Math.abs(p-2/3+1), Math.abs(p-2/3-1))*3);
    const duskF  = Math.max(0, 1 - Math.min(Math.abs(p-1/3), Math.abs(p-1/3+1), Math.abs(p-1/3-1))*3);
    const lightF = Math.min(1, nightF + duskF*0.35);   // 夜晚全亮，黃昏帶約三成暖意
    warmLights.forEach(l=> l.userData.targetInt = l.userData.onInt * lightF);
  });

  // ========================= 粒子點綴（花瓣 / 螢火蟲 / 海面反光）=========================
  // 圓形柔邊貼圖：讓粒子是柔和圓點而不是白方塊
  function softDotTex(){
    const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
    const c=cv.getContext('2d');
    const g=c.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(0.5,'rgba(255,255,255,0.85)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g; c.beginPath(); c.arc(s/2,s/2,s/2,0,Math.PI*2); c.fill();
    return new THREE.CanvasTexture(cv);
  }
  // 花瓣形狀貼圖：柔邊橢圓花瓣
  function petalTex(){
    const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
    const c=cv.getContext('2d'); c.translate(s/2,s/2); c.rotate(-0.5);
    const g=c.createRadialGradient(0,0,0,0,0,s/2);
    g.addColorStop(0,'rgba(255,255,255,0.95)');
    g.addColorStop(0.6,'rgba(255,214,228,0.9)');
    g.addColorStop(1,'rgba(255,190,214,0)');
    c.fillStyle=g; c.beginPath(); c.ellipse(0,0,s*0.22,s*0.4,0,0,Math.PI*2); c.fill();
    return new THREE.CanvasTexture(cv);
  }
  const DOT_TEX = softDotTex();
  const PETAL_TEX = petalTex();

  // 花瓣：白天/黃昏緩降搖擺（夜晚隱藏）
  const PETAL_N = 50;
  const petalGeo = new THREE.BufferGeometry();
  const petalPos = new Float32Array(PETAL_N*3);
  const petalData = [];
  for(let i=0;i<PETAL_N;i++){
    const x=(Math.random()-0.5)*60, y=4+Math.random()*18, z=(Math.random()-0.5)*60;
    petalPos[i*3]=x; petalPos[i*3+1]=y; petalPos[i*3+2]=z;
    petalData.push({ swing:Math.random()*Math.PI*2, swAmp:0.6+Math.random()*0.8,
      fall:0.6+Math.random()*0.7, baseX:x });
  }
  petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPos,3));
  const petalMat = new THREE.PointsMaterial({ color:0xffc1d8, size:0.9, map:PETAL_TEX, alphaTest:0.02,
    transparent:true, opacity:0.9, depthWrite:false });
  const petals = new THREE.Points(petalGeo, petalMat);
  scene.add(petals);

  // 螢火蟲：只在夜晚出現，島周圍緩慢遊走 + 明滅
  const FLY_N = 40;
  const flyGeo = new THREE.BufferGeometry();
  const flyPos = new Float32Array(FLY_N*3);
  const flyData = [];
  for(let i=0;i<FLY_N;i++){
    const a=Math.random()*Math.PI*2, r=5+Math.random()*16;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, y=1.5+Math.random()*4;
    flyPos[i*3]=x; flyPos[i*3+1]=y; flyPos[i*3+2]=z;
    flyData.push({ cx:x, cz:z, cy:y, phase:Math.random()*Math.PI*2,
      freq:0.8+Math.random()*1.4, drift:Math.random()*Math.PI*2, dr:1+Math.random()*2 });
  }
  flyGeo.setAttribute('position', new THREE.BufferAttribute(flyPos,3));
  const flyMat = new THREE.PointsMaterial({ color:0xd8ff88, size:0.9, map:DOT_TEX, alphaTest:0.01,
    transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending });
  const fireflies = new THREE.Points(flyGeo, flyMat);
  scene.add(fireflies);

  // 海面反光：貼近海面的隨機閃爍亮點
  const SPARK_N = 44;
  const sparkGeo = new THREE.BufferGeometry();
  const sparkPos = new Float32Array(SPARK_N*3);

  dayNightHooks.push((seaCol, reflDim)=>{

    // 夜晚程度：phase 約在 2/3 附近最暗
    const nightF = Math.max(0, 1 - Math.min(Math.abs(p-2/3), Math.abs(p-2/3+1), Math.abs(p-2/3-1))*3);

  function buildTripsHtml(){
    if(!tripsData.length){
      return '<p style="text-align:center;color:#7a95a3">旅行足跡整理中 ✈️</p>';
    }
    return tripsData.map((t, ti) => {
      const flag = t.flag || '✈️';
      const name = t.name || '';
      const note = t.note || '';
      const photos = Array.isArray(t.photos) ? t.photos : [];
      let media;
      if(photos.length){
        // 投影片輪播：一次一張大圖、箭頭/圓點切換、自動播放；點大圖以 Lightbox 全螢幕（data-trip + data-idx）
        const slides = photos.map((src, pi) =>
          `<img class="slide${pi===0?' on':''}" src="${src}" alt="${name}" loading="lazy" data-trip="${ti}" data-idx="${pi}">`
        ).join('');
        const dots = photos.length>1 ? `<div class="dots">` + photos.map((_,pi)=>
          `<span class="dot${pi===0?' on':''}" data-idx="${pi}"></span>`).join('') + `</div>` : '';
        const navs = photos.length>1
          ? `<button class="nav prev" data-dir="-1" aria-label="上一張">‹</button>
             <button class="nav next" data-dir="1" aria-label="下一張">›</button>
             <div class="count"><span class="cur">1</span>/${photos.length}</div>` : '';
        media = `<div class="slideshow" data-trip="${ti}">
          <div class="slides">${slides}</div>${navs}${dots}</div>`;
      } else {
        media = `<div class="photo-ph">照片整理中…</div>`;
      }
      return `<div class="trip-album">
        <div class="trip-head"><span class="trip-flag">${flag}</span><b>${name}</b></div>

        ${media}

    [[-0.12],[0.12]].forEach(p=>{const e=eyeBall(0.05*s); e.position.set(p[0]*s,headY-0.01*s,0.29*s); g.add(e);});
    const smile=new THREE.Mesh(new THREE.TorusGeometry(0.07*s,0.015*s,6,10,Math.PI),soft(0xc96a55)); smile.position.set(0,headY-0.14*s,0.3*s); smile.rotation.z=Math.PI; g.add(smile);
    return g;
  }

  const friendFolks = [];
  // place a little person on an island. isle = familyIsle | friendsIsle ; list = familyFolks | friendFolks
  function addPersonTo(isle, list, opt, lx, lz, name){
    const g = makePerson(opt);
    const person = new THREE.Group();
    person.add(g);
    const bubble=new THREE.Sprite(new THREE.SpriteMaterial({map:bubbleTex(name),transparent:true,depthTest:false}));
    const topY = (opt.kind==='man'?2.0:1.8)*(opt.scale||1);
    bubble.scale.set(2.2,1.1,1); bubble.position.y=topY+0.6; bubble.visible=false; person.add(bubble);
    const hit=new THREE.Mesh(new THREE.BoxGeometry(1.1,2.2*(opt.scale||1),1.1),new THREE.MeshBasicMaterial({visible:false})); hit.position.y=topY/2; person.add(hit);
    person.position.set(lx, 1.3, lz);
    person.rotation.y = Math.atan2(-lx, -lz);   // roughly face island centre
    person.userData = { bubble, hit, baseY:1.3, phase:Math.random()*Math.PI*2 };
    isle.add(person);
    list.push(person);
  }
  // shorthands
  const addFolk   = (opt, lx, lz, name)=> addPersonTo(familyIsle,  familyFolks, opt, lx, lz, name);
  const addFriend = (opt, lx, lz, name)=> addPersonTo(friendsIsle, friendFolks, opt, lx, lz, name);

  // ---- 家人島成員：依 data.js 的 family 讀資料生成 ----
  // 求婚保密：side:'me'（我的家人）求婚前不出現在島上，求婚成功後才補上（見 giveRing）
  const familyPending = [];   // 存放尚未生成的「我的家人」資料，等 giveRing 時補上
  familyData.forEach(p => {
    if(p.side === 'me' && !ringGiven){ familyPending.push(p); return; }
    addFolk(p.opt || {}, p.lx, p.lz, p.name || '');
  });
  function revealMyFamily(){
    const before = familyFolks.length;
    familyPending.forEach(p => addFolk(p.opt || {}, p.lx, p.lz, p.name || ''));
    familyPending.length = 0;
    // 新出現的小人從很小彈出來（animate 迴圈會把 scale lerp 回 1）
    for(let i = before; i < familyFolks.length; i++) familyFolks[i].scale.setScalar(0.01);
  }

  // ========================= 好友島：好友小人（依 data.js 的 friends 讀資料生成，名單後補只改 data.js） =========================
  friendsData.forEach(p => addFriend(p.opt || {}, p.lx, p.lz, p.name || ''));

  // ========================= raycast / interaction =========================
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hovered = null, hoveredCritter = null;

  function pointer(e){ const t=e.touches?e.touches[0]:e; mouse.x=(t.clientX/innerWidth)*2-1; mouse.y=-(t.clientY/innerHeight)*2+1; }
  function pick(){ ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(blocks.map(b=>b.userData.cube),false); return h.length?blocks.find(b=>b.userData.cube===h[0].object):null; }
  function pickCritter(){ ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(residents.map(r=>r.userData.hit),false); return h.length?residents.find(r=>r.userData.hit===h[0].object):null; }
  function pickMe(){ ray.setFromCamera(mouse,camera); return ray.intersectObject(me.userData.hit,false).length?me:null; }
  const allFolks = ()=> familyFolks.concat(friendFolks);
  function pickFolk(){ ray.setFromCamera(mouse,camera); const list=allFolks(); const h=ray.intersectObjects(list.map(f=>f.userData.hit),false); return h.length?list.find(f=>f.userData.hit===h[0].object):null; }
  // which island/card a folk belongs to
  function folkInfo(f){ return friendFolks.includes(f)
    ? { card:'friends', focus:new THREE.Vector3(-19,2,19) }
    : { card:'family',  focus:new THREE.Vector3( 19,2,19) }; }
  let hoveredFolk = null;
  // 迪士尼島小人：hover 命中（泡泡顯示），點擊時飛向迪士尼島並開卡片
  function pickDisney(){ ray.setFromCamera(mouse,camera); const h=ray.intersectObjects(disneyPals.map(f=>f.userData.hit),false); return h.length?disneyPals.find(f=>f.userData.hit===h[0].object):null; }
  let hoveredDisney = null;

  renderer.domElement.addEventListener('pointermove', e=>{
    pointer(e);
    const b=pick(); if(b!==hovered) hovered=b;
    const c=pickCritter();
    if(c!==hoveredCritter){ if(hoveredCritter) hoveredCritter.userData.bubble.visible=false; hoveredCritter=c; if(c) c.userData.bubble.visible=true; }
    const f=pickFolk();
    if(f!==hoveredFolk){ if(hoveredFolk) hoveredFolk.userData.bubble.visible=false; hoveredFolk=f; if(f) f.userData.bubble.visible=true; }
    const dp=pickDisney();
    if(dp!==hoveredDisney){ if(hoveredDisney) hoveredDisney.userData.bubble.visible=false; hoveredDisney=dp; if(dp) dp.userData.bubble.visible=true; }
    const m=pickMe();
    renderer.domElement.style.cursor=(b||c||m||f||dp)?'pointer':'grab';
  });

  let downX=0, downY=0;
  renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; });
  renderer.domElement.addEventListener('pointerup', e=>{
    if(intro) return;                            // 進場動畫期間鎖住點擊互動
    if(Math.abs(e.clientX-downX)>6 || Math.abs(e.clientY-downY)>6) return;
    pointer(e);
    if(pickMe()){ flyTo(new THREE.Vector3(0,2.2,0), 9); openCard('propose'); return; }
    const b=pick(); if(b){
      // 迪士尼島城堡：夜晚點 → 不放大鏡頭、不開卡片，直接放一輪煙火；白天點 → 照常飛過去開卡片
      if(b.userData.key==='disney'){
        if(isNightNow()){ launchFireworks(); return; }
        flyTo(b.userData.focus, 11); openCard('disney'); return;
      }
      flyTo(b.userData.focus, 11); openCard(b.userData.key); return;
    }
    const f=pickFolk(); if(f){ f.userData.bubble.visible=true; const info=folkInfo(f); flyTo(info.focus, 13); openCard(info.card); return; }
    // 點迪士尼島吉祥物：夜晚直接放煙火（不放大、不開卡片）；白天飛過去開卡片
    const dp=pickDisney(); if(dp){ dp.userData.bubble.visible=true; if(isNightNow()){ launchFireworks(); return; } flyTo(DISNEY_FOCUS, 13); openCard('disney'); return; }
    const c=pickCritter(); if(c){ c.userData.bubble.visible=true; openCard('zoo'); }
  });

  // ========================= camera fly-to =========================
  function flyTo(targetPoint, dist){
    const dir=new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    const camTo=new THREE.Vector3().copy(targetPoint).add(dir.multiplyScalar(dist));
    camTo.y=Math.max(camTo.y, targetPoint.y+3);
    fly={ camFrom:camera.position.clone(), camTo, tgtFrom:controls.target.clone(), tgtTo:targetPoint.clone(), t:0 };
    controls.autoRotate=false;
  }

  // ========================= card =========================
  const cardEl = document.getElementById('card');

  // ========================= 照片燈箱 Lightbox =========================
  const lbEl    = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lb-img');
  const lbCount = document.getElementById('lb-count');
  const lbPrev  = lbEl.querySelector('.lb-prev');
  const lbNext  = lbEl.querySelector('.lb-next');
  const lbClose = lbEl.querySelector('.lb-close');
  let lbList = [];          // 當前相簿的照片路徑陣列
  let lbIndex = 0;
  let lightboxOpen = false;

  function openLightbox(list, idx){
    lbList = Array.isArray(list) ? list : [list];
    lbIndex = Math.max(0, Math.min(idx||0, lbList.length-1));
    renderLightbox();
    lbEl.classList.add('show'); lbEl.setAttribute('aria-hidden','false');
    lightboxOpen = true;
  }
  function renderLightbox(){
    lbImg.src = lbList[lbIndex] || '';
    const multi = lbList.length > 1;
    lbPrev.disabled = !multi; lbNext.disabled = !multi;
    lbCount.style.display = multi ? 'block' : 'none';
    if(multi) lbCount.textContent = `第 ${lbIndex+1} / 共 ${lbList.length} 張`;
  }
  function lbStep(dir){
    if(lbList.length<2) return;
    lbIndex = (lbIndex + dir + lbList.length) % lbList.length;
    renderLightbox();
  }
  function closeLightbox(){
    lbEl.classList.remove('show'); lbEl.setAttribute('aria-hidden','true');
    lightboxOpen = false; lbImg.src='';
  }
  lbPrev.addEventListener('click', e=>{ e.stopPropagation(); lbStep(-1); });
  lbNext.addEventListener('click', e=>{ e.stopPropagation(); lbStep(1); });
  lbClose.addEventListener('click', e=>{ e.stopPropagation(); closeLightbox(); });
  lbEl.addEventListener('click', e=>{ if(e.target===lbEl) closeLightbox(); });   // 點遮罩關閉
  // 手機左右滑動切換
  let lbTouchX = null;
  lbEl.addEventListener('touchstart', e=>{ lbTouchX = e.touches[0].clientX; }, {passive:true});
  lbEl.addEventListener('touchend', e=>{
    if(lbTouchX===null) return;
    const dx = e.changedTouches[0].clientX - lbTouchX;
    if(Math.abs(dx)>40) lbStep(dx<0 ? 1 : -1);
    lbTouchX = null;
  });

  // 投影片自動播放計時器（卡片關閉時清掉，見 closeCard）
  let slideTimers = [];
  function clearSlideTimers(){ slideTimers.forEach(id=>clearInterval(id)); slideTimers = []; }

  // 綁定卡片內照片／投影片：點 .photo 開單張 Lightbox；旅行投影片自動輪播 + 箭頭/圓點 + 點圖全螢幕
  function wireCardMedia(bodyEl){
    bodyEl.querySelectorAll('.photo').forEach(img=>{
      img.addEventListener('click', ()=> openLightbox([img.getAttribute('src')], 0));
    });
    clearSlideTimers();
    bodyEl.querySelectorAll('.slideshow').forEach(box=>{
      const slides = Array.from(box.querySelectorAll('.slide'));
      if(!slides.length) return;
      const dots = Array.from(box.querySelectorAll('.dot'));
      const curEl = box.querySelector('.cur');
      let idx = 0;
      function show(n){
        idx = (n + slides.length) % slides.length;
        slides.forEach((s,i)=> s.classList.toggle('on', i===idx));
        dots.forEach((d,i)=> d.classList.toggle('on', i===idx));
        if(curEl) curEl.textContent = (idx+1);
      }
      // 箭頭
      box.querySelectorAll('.nav').forEach(btn=>{
        btn.addEventListener('click', e=>{ e.stopPropagation(); show(idx + parseInt(btn.getAttribute('data-dir'),10)); resetAuto(); });
      });
      // 圓點
      dots.forEach(d=> d.addEventListener('click', e=>{ e.stopPropagation(); show(parseInt(d.getAttribute('data-idx'),10)); resetAuto(); }));
      // 點投影片 → 全螢幕 Lightbox（帶整個地點相簿，從目前這張開始）
      slides.forEach(s=> s.addEventListener('click', ()=>{
        const ti = parseInt(s.getAttribute('data-trip'),10);
        const t = tripsData[ti];
        const photos = (t && Array.isArray(t.photos) && t.photos.length) ? t.photos : [s.getAttribute('src')];
        openLightbox(photos, idx);
      }));
      // 自動播放（多於一張才跑）
      let auto = null;
      function resetAuto(){ if(auto) clearInterval(auto); if(slides.length>1){ auto=setInterval(()=>show(idx+1), 3500); slideTimers.push(auto); } }
      resetAuto();
    });
  }

  // ========================= 音訊（BGM + 音效，缺檔靜默防呆）=========================
  const bgmBtn = document.getElementById('bgmBtn');
  let bgmAudio = null, bgmOn = false;
  const sfxCache = {};

  function makeAudio(src, vol, loop){
    if(!src) return null;
    try{
      const a = new Audio(src);
      a.volume = (typeof vol==='number') ? vol : 0.5;
      a.loop = !!loop;
      a.addEventListener('error', ()=>{ /* 缺檔／載入失敗：靜默略過 */ });
      return a;
    }catch(e){ return null; }
  }
  function sfxPlay(name){
    try{
      const src = (audioData.sfx || {})[name];
      if(!src) return;
      let a = sfxCache[name];
      if(!a){ a = makeAudio(src, audioData.sfxVolume, false); sfxCache[name] = a; }
      if(a){ a.currentTime = 0; a.play().catch(()=>{}); }
    }catch(e){ /* 靜默 */ }
  }
  function bgmSetOn(on){
    bgmOn = on;
    if(on){
      if(!bgmAudio) bgmAudio = makeAudio(audioData.bgmSrc, audioData.bgmVolume, true);
      if(bgmAudio) bgmAudio.play().catch(()=>{});   // 自動播放被擋時不報錯
      bgmBtn.textContent = '🔊 音樂';
    }else{
      if(bgmAudio) bgmAudio.pause();
      bgmBtn.textContent = '🔇 音樂';
    }
  }
  bgmBtn.addEventListener('click', ()=> bgmSetOn(!bgmOn));
  // 預設開啟時，等第一次互動再嘗試播放（遵守自動播放政策）
  if(audioData.bgmDefaultOn){
    const kick = ()=>{ bgmSetOn(true); window.removeEventListener('pointerdown', kick); };
    window.addEventListener('pointerdown', kick, {once:true});
  }

  function openCard(key){
    const d=DATA[key];
    if(!d) return;                               // 缺卡防呆，不崩潰
    sfxPlay('click');                            // 點島／開卡片音效（缺檔靜默）
    document.getElementById('card-ic').textContent=d.ic || '💖';
    document.getElementById('card-title').textContent=d.title || '';
    // zoo / trips 由資料動態生成；其餘用卡片 html
    let html;
    if(key==='zoo')      html = buildZooHtml();
    else if(key==='trips') html = buildTripsHtml();
    else if(key==='family') html = (d.html || '') + (ringGiven ? (d.htmlAfterPropose || '') : '');   // 我的家人：求婚成功後才接上
    else                 html = d.html || '';
    const bodyEl = document.getElementById('card-body');
    bodyEl.innerHTML = html;
    wireCardMedia(bodyEl);                        // 綁定照片／縮圖的 Lightbox
    cardEl.classList.toggle('propose', key==='propose');
    cardEl.classList.add('show');
    controls.autoRotate=false; hintEl.style.opacity=0;
    if(key==='propose'){
      forceDuskForPropose();   // 求婚：強制平滑切到黃昏並點燈
      revealRingBox();   // the moment of truth: he takes out the ring box
      wirePropose();
    }
  }
  // proposal begins: he changes into a suit and takes out the ring box
  function revealRingBox(){
    if(ringGiven) return;                       // already proposed & accepted
    if(me){
      me.userData.casual.visible=false;         // 脫下便服
      me.userData.formal.visible=true;          // 換上西裝
      ['box','lid','ringInBox'].forEach(k=>{ if(me.userData[k]) me.userData[k].visible=true; });
    }
  }
  function closeCard(){
    if(lightboxOpen){ closeLightbox(); return; }   // 燈箱開著時，先關燈箱
    cardEl.classList.remove('show'); controls.autoRotate=true;
    clearSlideTimers();   // 關卡片時停掉旅行投影片自動播放
    // if proposal was opened but not accepted, revert to casual + hide ring (keep surprise)
    if(!ringGiven && me){
      me.userData.casual.visible=true;
      me.userData.formal.visible=false;
      ['box','lid','ringInBox'].forEach(k=>{ if(me.userData[k]) me.userData[k].visible=false; });
      restoreDayNightAfterPropose();   // 未答應：平滑還原到進入前日夜狀態並熄燈
    }
  }
  cardEl.querySelector('.close').addEventListener('click', closeCard);
  addEventListener('keydown', e=>{
    if(e.key==='Escape'){ if(lightboxOpen) closeLightbox(); else closeCard(); }
    else if(lightboxOpen && e.key==='ArrowLeft')  lbStep(-1);
    else if(lightboxOpen && e.key==='ArrowRight') lbStep(1);
  });

  // ========================= propose =========================
  function wirePropose(){
    const btn=document.getElementById('yesBtn');
    if(!btn) return;
    btn.addEventListener('click', ()=>{
      document.getElementById('propose-actions').style.display='none';
      document.getElementById('propose-answer').style.display='block';
      confettiBurst();
      sfxPlay('propose');   // 求婚成功慶祝音效（缺檔靜默）
      proposeActive=true;
      giveRing();
    });
  }
  function giveRing(){
    if(ringGiven) return; ringGiven=true;
    // show ring on Wendy, show her bubble, remove groom's ring box
    if(wendyRing) wendyRing.visible=true;
    if(wendy) wendy.userData.bubble.visible=true;
    if(me){ ['box','lid','ringInBox'].forEach(k=>{ if(me.userData[k]) me.userData[k].visible=false; }); }
    revealMyFamily();   // 求婚成功：我的家人才正式登島（之前是秘密）
  }
  function confettiBurst(){
    const emojis=['💖','💍','🎉','💕','✨','💗'];
    for(let i=0;i<70;i++){
      const s=document.createElement('div'); s.textContent=emojis[i%emojis.length];
      s.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-40px;font-size:${18+Math.random()*22}px;z-index:40;pointer-events:none;transition:transform ${2+Math.random()*2}s linear, opacity 3s`;
      document.body.appendChild(s);
      requestAnimationFrame(()=>{ s.style.transform=`translateY(${100+Math.random()*20}vh) rotate(${Math.random()*720-360}deg)`; s.style.opacity='0'; });
      setTimeout(()=>s.remove(),4500);
    }
  }

  // ========================= 3D heart rain =========================
  const heartGeoShape=(()=>{ const sh=new THREE.Shape();
    sh.moveTo(0,0.5); sh.bezierCurveTo(0,0.9,-0.5,1.2,-0.9,0.7); sh.bezierCurveTo(-1.4,0.1,-0.5,-0.5,0,-1);
    sh.bezierCurveTo(0.5,-0.5,1.4,0.1,0.9,0.7); sh.bezierCurveTo(0.5,1.2,0,0.9,0,0.5);
    const g=new THREE.ExtrudeGeometry(sh,{depth:0.3,bevelEnabled:false}); g.center(); g.scale(0.4,0.4,0.4); return g; })();
  const rainHearts=[]; let rainInit=false;
  function initHeartRain(){
    const cols=[0xff5d8f,0xff8fab,0xffd166,0xffffff];
    for(let i=0;i<40;i++){ const m=new THREE.Mesh(heartGeoShape,flat(cols[i%cols.length]));
      m.position.set((Math.random()-0.5)*36,10+Math.random()*14,(Math.random()-0.5)*36);
      m.userData={vy:0.04+Math.random()*0.06,spin:(Math.random()-0.5)*0.1}; scene.add(m); rainHearts.push(m); }
    rainInit=true;
  }
  function heartRainStep(){
    if(!rainInit) initHeartRain();
    rainHearts.forEach(h=>{ h.position.y-=h.userData.vy*4; h.rotation.y+=h.userData.spin; h.rotation.z+=h.userData.spin*0.5;
      if(h.position.y<-2){ h.position.y=12+Math.random()*12; h.position.x=(Math.random()-0.5)*36; h.position.z=(Math.random()-0.5)*36; } });
  }

  // ========================= 煙火（晚上點城堡才放一輪）=========================
  // 效能：粒子預先配置一次，之後重複使用；用旗標 fireworksActive 控制是否更新，放完自動停。
  const FW_SHELLS = 12;                // 一輪幾發（加密，接近滿天煙火秀）
  const FW_PER_SHELL = 55;             // 每發炸開的粒子數（節制，手機可順跑）
  const FW_TOTAL = FW_SHELLS * FW_PER_SHELL;
  const fwColors = [0xff5d8f, 0xffd166, 0x7cc4f0, 0xb79cf0, 0x8cff9e, 0xffffff, 0xffa64d, 0xff4fa0];
  const FW_GOLD = 0xffd98a;            // 金色柳條/拖尾專用
  const fwGeo = new THREE.BufferGeometry();
  const fwPos = new Float32Array(FW_TOTAL*3);
  const fwCol = new Float32Array(FW_TOTAL*3);
  // 每個粒子的狀態（速度、生命）；每發共用一個發射中心與引爆時間
  const fwParticles = [];
  for(let i=0;i<FW_TOTAL;i++){
    fwPos[i*3]=0; fwPos[i*3+1]=-999; fwPos[i*3+2]=0;   // 預設藏在視野外
    fwCol[i*3]=1; fwCol[i*3+1]=1; fwCol[i*3+2]=1;
    fwParticles.push({ vx:0, vy:0, vz:0, life:0, drag:0.96, grav:3.2, decay:0.55 });
  }
  fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPos,3));
  fwGeo.setAttribute('color', new THREE.BufferAttribute(fwCol,3));
  const fwMat = new THREE.PointsMaterial({ size:0.5, map:DOT_TEX, vertexColors:true, alphaTest:0.01,
    transparent:true, opacity:1, depthWrite:false, blending:THREE.AdditiveBlending });
  const fireworks = new THREE.Points(fwGeo, fwMat);
  fireworks.visible = false;
  scene.add(fireworks);

  // 升空彈：每發一個亮點，從島面往上飛到 apex（引爆高度）才散開。每發一顆，共 FW_SHELLS 顆。
  const fwRiseGeo = new THREE.BufferGeometry();
  const fwRisePos = new Float32Array(FW_SHELLS*3);
  const fwRiseCol = new Float32Array(FW_SHELLS*3);
  for(let r=0;r<FW_SHELLS;r++){ fwRisePos[r*3]=0; fwRisePos[r*3+1]=-999; fwRisePos[r*3+2]=0;
    fwRiseCol[r*3]=1; fwRiseCol[r*3+1]=0.9; fwRiseCol[r*3+2]=0.6; }
  fwRiseGeo.setAttribute('position', new THREE.BufferAttribute(fwRisePos,3));
  fwRiseGeo.setAttribute('color', new THREE.BufferAttribute(fwRiseCol,3));
  const fwRiseMat = new THREE.PointsMaterial({ size:0.55, map:DOT_TEX, vertexColors:true, alphaTest:0.01,
    transparent:true, opacity:1, depthWrite:false, blending:THREE.AdditiveBlending });
  const fwRise = new THREE.Points(fwRiseGeo, fwRiseMat);
  fwRise.visible = false;
  scene.add(fwRise);

  let fireworksActive = false;
  const fwShells = [];                 // 每發：{launchPos,center,apexY,launchDelay,riseSpeed,launched,rising,fired,riseY,kind}
  let fwTimer = 0;

  // 城堡彩色打光：放煙火時在城堡上打一顆會變色的點光（像煙火秀把城堡照亮），結束後熄滅。
  const castleLight = new THREE.PointLight(0xff7ad0, 0, 30, 2);
  castleLight.position.set(-19, 9, -17);           // 迪士尼島城堡上方略前
  scene.add(castleLight);
  const castleLight2 = new THREE.PointLight(0x7ab8ff, 0, 30, 2);
  castleLight2.position.set(-19, 5, -21);          // 另一側補一顆冷色
  scene.add(castleLight2);
  let castleLitT = 0;                               // 打光剩餘時間

  // 在迪士尼島上空放一輪煙火（每發延遲引爆，炸成一圈彩色粒子後擴散淡出下墜）
  function launchFireworks(){
    if(fireworksActive) return;        // 正在放就不重疊觸發
    fireworksActive = true;
    fireworks.visible = true;
    fwTimer = 0;
    fwShells.length = 0;
    const kinds = ['burst','willow','rocket'];   // 球狀綻放 / 金色柳條下垂 / 上噴拖尾
    for(let s=0;s<FW_SHELLS;s++){
      // 發射起點：島上地面散開一點；apex：引爆的目標高度（不同發不同高）
      const sx = -19 + (Math.random()-0.5)*9, sz = -19 + (Math.random()-0.5)*9;
      const apexY = 11 + Math.random()*6;
      fwShells.push({
        launchPos: new THREE.Vector3(sx, 1.6, sz),               // 從島面升空
        center: new THREE.Vector3(sx, apexY, sz),                // 到頂引爆處
        apexY: apexY,
        launchDelay: s*0.42 + Math.random()*0.22,                // 何時「發射升空」
        riseSpeed: 11 + Math.random()*3,                         // 升空速度
        launched: false,   // 是否已開始升空
        rising: false,     // 升空中
        fired: false,      // 是否已引爆
        riseY: 1.6,        // 目前升空高度
        kind: kinds[Math.floor(Math.random()*kinds.length)]
      });
    }
    // 升空彈的拖尾用煙火緩衝的「最後一格」範圍不夠，改用專屬升空點（見 fwRise*）
    for(let r=0;r<FW_SHELLS;r++){ fwRisePos[r*3]=0; fwRisePos[r*3+1]=-999; fwRisePos[r*3+2]=0; }
    fwRiseGeo.attributes.position.needsUpdate = true;
    fwRise.visible = true;
    // 重置所有粒子為死亡、藏起來
    for(let i=0;i<FW_TOTAL;i++){ fwParticles[i].life=0; fwPos[i*3+1]=-999; }
    fwMat.opacity = 1;
    fwGeo.attributes.position.needsUpdate = true;
    castleLitT = FW_SHELLS*0.42 + 3.0;             // 城堡打光持續到最後一發升空+散完
  }

  // 引爆一發：依型態（burst 球狀 / willow 金色柳條 / rocket 上噴拖尾）賦予初速、顏色、物理。
  function fwExplode(shellIdx, color){
    const sh = fwShells[shellIdx];
    const kind = sh.kind || 'burst';
    const c = new THREE.Color(kind==='willow' ? FW_GOLD : color);
    const base = shellIdx * FW_PER_SHELL;
    const center = sh.center;
    for(let k=0;k<FW_PER_SHELL;k++){
      const i = base + k;
      const p = fwParticles[i];
      const u = Math.random()*2-1, th = Math.random()*Math.PI*2;
      const r = Math.sqrt(1-u*u);
      if(kind==='willow'){
        // 金色柳條：球狀散開但速度較慢、重力偏強、慢淡出 → 形成下垂柳條
        const spd = 2.2 + Math.random()*2;
        p.vx = r*Math.cos(th)*spd; p.vy = Math.abs(u)*spd*0.8 + 0.5; p.vz = r*Math.sin(th)*spd;
        p.drag = 0.985; p.grav = 4.2; p.decay = 0.40;
      }else if(kind==='rocket'){
        // 上噴拖尾：大多向上噴射的柱狀，少量橫向，拖尾感
        const spd = 4 + Math.random()*3;
        p.vx = r*Math.cos(th)*spd*0.35; p.vy = Math.abs(u)*spd + 2.5; p.vz = r*Math.sin(th)*spd*0.35;
        p.drag = 0.97; p.grav = 3.0; p.decay = 0.5;
      }else{
        // 球狀綻放：四面八方均勻
        const spd = 3 + Math.random()*3.2;
        p.vx = r*Math.cos(th)*spd; p.vy = u*spd; p.vz = r*Math.sin(th)*spd;
        p.drag = 0.96; p.grav = 3.2; p.decay = 0.55;
      }
      p.life = 1;
      fwPos[i*3]=center.x; fwPos[i*3+1]=center.y; fwPos[i*3+2]=center.z;
      fwCol[i*3]=c.r; fwCol[i*3+1]=c.g; fwCol[i*3+2]=c.b;
    }
    fwGeo.attributes.color.needsUpdate = true;   // 新顏色上傳 GPU
  }

  // 每幀推進煙火（dt）：每發先「升空」→ 升到 apex 才「引爆」散開落下。全部死亡後自動停止。
  function fireworksStep(dt){
    fwTimer += dt;
    let anyRising = false;
    // 升空階段：到了 launchDelay 就開始從島面往上飛；升到 apex 引爆
    for(let s=0;s<fwShells.length;s++){
      const sh = fwShells[s];
      if(sh.fired) continue;
      if(!sh.launched && fwTimer >= sh.launchDelay){ sh.launched = true; sh.rising = true; sh.riseY = sh.launchPos.y; }
      if(sh.rising){
        anyRising = true;
        sh.riseY += sh.riseSpeed * dt;
        if(sh.riseY >= sh.apexY){
          // 到頂：引爆散開，升空彈藏起來
          sh.rising = false; sh.fired = true;
          fwRisePos[s*3+1] = -999;
          fwExplode(s, fwColors[(s + Math.floor(Math.random()*fwColors.length)) % fwColors.length]);
        }else{
          // 升空中：更新升空彈亮點位置（帶一點微抖做拖尾感）
          fwRisePos[s*3]   = sh.launchPos.x;
          fwRisePos[s*3+1] = sh.riseY;
          fwRisePos[s*3+2] = sh.launchPos.z;
        }
      }
    }
    fwRiseGeo.attributes.position.needsUpdate = true;

    let anyAlive = false;
    for(let i=0;i<FW_TOTAL;i++){
      const p = fwParticles[i];
      if(p.life <= 0) continue;
      anyAlive = true;
      p.vy -= p.grav * dt;              // 重力下墜（依型態）
      p.vx *= p.drag; p.vz *= p.drag;   // 空氣阻力（依型態）
      fwPos[i*3]   += p.vx * dt;
      fwPos[i*3+1] += p.vy * dt;
      fwPos[i*3+2] += p.vz * dt;
      p.life -= dt*p.decay;             // 逐漸淡出（依型態）
      if(p.life <= 0){ fwPos[i*3+1] = -999; }   // 死亡藏起來
    }
    fwGeo.attributes.position.needsUpdate = true;
    // 整體淡出（最後一發升空+散開後才開始降透明度）
    fwMat.opacity = Math.max(0, 1 - Math.max(0, fwTimer - (FW_SHELLS*0.42 + 2.4)) * 0.6);
    // 全部引爆完、無升空中、無存活粒子 → 停止這一輪
    const allFired = fwShells.every(s=>s.fired);
    if(allFired && !anyRising && !anyAlive){
      fireworksActive = false;
      fireworks.visible = false;
      fwRise.visible = false;
      fwMat.opacity = 1;
    }
  }

  // 城堡彩色打光推進：放煙火期間亮起並緩慢變色，結束後平滑熄滅。
  let castleHue = 0;
  function castleLightStep(dt){
    const target = castleLitT > 0 ? 2.4 : 0;       // 打光期間目標亮度
    castleLight.intensity  += (target - castleLight.intensity)  * Math.min(1, dt*3);
    castleLight2.intensity += (target*0.7 - castleLight2.intensity) * Math.min(1, dt*3);
    if(castleLitT > 0){
      castleLitT -= dt;
      castleHue = (castleHue + dt*0.15) % 1;        // 緩慢循環色相
      castleLight.color.setHSL(castleHue, 0.8, 0.6);
      castleLight2.color.setHSL((castleHue+0.5)%1, 0.8, 0.6);
    }
  }

  // 夜晚判斷：沿用現有 nightF 算法（phase 2/3 附近最暗），nightF>0.5 視為夜晚。
  function isNightNow(){
    const p = ((dayNightPhase % 1)+1)%1;
    const nightF = Math.max(0, 1 - Math.min(Math.abs(p-2/3), Math.abs(p-2/3+1), Math.abs(p-2/3-1))*3);
    return nightF > 0.5;
  }

  // ========================= resize =========================
  addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  // ========================= 進場動畫（鏡頭從遠方海面低角度飛近主島）=========================
  const INTRO_VIEW = { pos:new THREE.Vector3(24,22,30), tgt:new THREE.Vector3(0,1.5,0) };
  let intro = null;
  function startIntro(){
    camera.position.set(76, 3.5, 68);              // 遠方、貼近海面、低角度
    controls.target.set(0, 1.5, 0);
    controls.enabled = false; controls.autoRotate = false;
    intro = { camFrom:camera.position.clone(), camTo:INTRO_VIEW.pos.clone(),
      tgtFrom:controls.target.clone(), tgtTo:INTRO_VIEW.tgt.clone(), t:0, dur:3.6 };
  }

  // ========================= animate =========================
  const clock = new THREE.Clock();
  let elapsed = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);   // 夾住大幀距，避免切背景分頁後跳動
    elapsed += dt;
    const t = elapsed;

    // ---- 日夜循環 ----
    if(dnTween){
      dnTween.t = Math.min(1, dnTween.t + dt/dnTween.dur);
      const e = 1-Math.pow(1-dnTween.t, 3);
      // 以最短路徑插值 phase
      let from=dnTween.from, to=dnTween.to, diff=to-from;
      if(diff> 0.5) diff-=1; if(diff<-0.5) diff+=1;
      dayNightPhase = ((from + diff*e) % 1 + 1) % 1;
      if(dnTween.t>=1){ if(dnTween.after) dnTween.after(); dnTween=null; }
    } else if(dnAuto){
      dayNightPhase = (dayNightPhase + dt/DN_CYCLE) % 1;
    }
    applyDayNightPhase(dayNightPhase);

    // 暖色點燈平滑亮/滅
    warmLights.forEach(l=>{ l.intensity += (l.userData.targetInt - l.intensity) * Math.min(1, dt*3); });

    // sea waves
    const pos=sea.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){ const ix=i*3; const x=seaBase[ix], y=seaBase[ix+1];
      pos.array[ix+2]=Math.sin(x*0.3+t*1.2)*0.25+Math.cos(y*0.3+t)*0.25; }
    pos.needsUpdate=true;

    island.position.y=Math.sin(t*0.8)*0.18;
    satellites.forEach(s=>{ s.group.position.y=s.baseY+Math.sin(t*0.7+s.phase)*0.3; });

    // Wendy + Me idle
    if(wendy){ wendy.position.y=wendy.userData.baseY+Math.sin(t*1.1)*0.1; wendy.rotation.y=0.4+Math.sin(t*0.5)*0.15; }
    if(me){ me.position.y=me.userData.baseY+Math.sin(t*1.1+1)*0.1; }

    // 進場飛行（優先於一般 flyTo）
    if(intro){
      intro.t = Math.min(1, intro.t + dt/intro.dur);
      const e = 1-Math.pow(1-intro.t, 3);
      camera.position.lerpVectors(intro.camFrom, intro.camTo, e);
      controls.target.lerpVectors(intro.tgtFrom, intro.tgtTo, e);
      if(intro.t>=1){ intro=null; controls.enabled=true; controls.autoRotate=true; }
    } else if(fly){ fly.t=Math.min(1,fly.t+0.02); const e=1-Math.pow(1-fly.t,3);
      camera.position.lerpVectors(fly.camFrom,fly.camTo,e); controls.target.lerpVectors(fly.tgtFrom,fly.tgtTo,e); if(fly.t>=1) fly=null; }

    if(proposeActive) heartRainStep();

    // landmarks bob + hover
    blocks.forEach(b=>{ b.position.y=b.userData.baseY+Math.sin(t*1.5+b.userData.phase)*0.15; b.rotation.y+=0.004;
      const target=(b===hovered)?1.18:1; b.scale.lerp(new THREE.Vector3(target,target,target),0.15); });

    // residents wander
    residents.forEach(r=>{ const u=r.userData; u.angle+=u.turn+0.004;
      const nx=r.position.x+Math.sin(u.angle)*u.speed*0.08, nz=r.position.z+Math.cos(u.angle)*u.speed*0.08;
      if(Math.hypot(nx,nz)<6.3){ r.position.x=nx; r.position.z=nz; } else { u.angle+=Math.PI; u.turn=(Math.random()-0.5)*0.02; }
      r.rotation.y=u.angle;
      r.position.y=u.baseY+Math.abs(Math.sin(t*4+u.phase))*0.12;
      const s=(r===hoveredCritter)?1.22:1; r.scale.lerp(new THREE.Vector3(s,s,s),0.18); });

    clouds.forEach((c,i)=>{ c.position.x+=0.01+i*0.003; if(c.position.x>30) c.position.x=-30; });

    // seagulls circle & flap
    birds.forEach(b=>{ const u=b.userData; u.ang+=u.spd;
      b.position.set(Math.cos(u.ang)*u.r, u.h+Math.sin(u.ang*2)*0.6, Math.sin(u.ang)*u.r);
      b.rotation.y=-u.ang;
      const flap=Math.sin(t*8+u.ang)*0.5; u.wL.rotation.z=Math.PI/2+flap; u.wR.rotation.z=-Math.PI/2-flap;
    });

    // family + friend folks: gentle sway + hover pop
    allFolks().forEach(f=>{
      const u=f.userData;
      f.position.y=u.baseY+Math.sin(t*2+u.phase)*0.06;
      f.rotation.z=Math.sin(t*1.5+u.phase)*0.03;
      const s=(f===hoveredFolk)?1.18:1; f.scale.lerp(new THREE.Vector3(s,s,s),0.18);
    });

    // 迪士尼島：旋轉木馬緩慢繞 Y 軸轉動（預先配置、不每幀 new）
    if(carouselSpinner) carouselSpinner.rotation.y += dt*0.6;

    // 迪士尼島圓耳朵小人：輕輕上下 + 搖擺 + hover 放大
    disneyPals.forEach(f=>{
      const u=f.userData;
      f.position.y=u.baseY+Math.sin(t*2+u.phase)*0.06;
      f.rotation.z=Math.sin(t*1.5+u.phase)*0.03;
      const s=(f===hoveredDisney)?1.18:1; f.scale.lerp(new THREE.Vector3(s,s,s),0.18);
    });

    // 煙火：只在啟動的一輪期間更新，放完自動停（旗標控制，不影響其他邏輯）
    if(fireworksActive) fireworksStep(dt);
    castleLightStep(dt);   // 城堡打光：亮起/變色/平滑熄滅（放完煙火才熄）

    // 雲倒影跟著雲 x 移動
    cloudRefls.forEach(cr=>{ cr.mesh.position.x = cr.cloud.position.x; });

    // ---- 粒子更新 ----
    // 花瓣：緩降 + 左右搖擺，落到海面重置回高空
    const pp = petals.geometry.attributes.position;
    for(let i=0;i<PETAL_N;i++){
      const d=petalData[i];
      let y = pp.array[i*3+1] - d.fall*dt;
      let x = d.baseX + Math.sin(t*0.8 + d.swing)*d.swAmp;
      if(y < seaY){ y = 14+Math.random()*8; d.baseX=(Math.random()-0.5)*60; pp.array[i*3+2]=(Math.random()-0.5)*60; }
      pp.array[i*3]=x; pp.array[i*3+1]=y;
    }
    pp.needsUpdate = true;
    // 螢火蟲：緩慢遊走 + 明滅（明滅用整體 opacity 的夜晚因子已在日夜回呼處理，這裡做位置遊走與個別微閃）
    if(flyMat.opacity > 0.01){
      const fp = fireflies.geometry.attributes.position;
      for(let i=0;i<FLY_N;i++){
        const d=flyData[i];
        fp.array[i*3]   = d.cx + Math.sin(t*0.4 + d.drift)*d.dr;
        fp.array[i*3+1] = d.cy + Math.sin(t*0.6 + d.phase)*0.6;
        fp.array[i*3+2] = d.cz + Math.cos(t*0.4 + d.drift)*d.dr;
      }
      fp.needsUpdate = true;
    }
    // 海面反光：整體閃爍（size 呼吸）
    sparkMat.size = 0.5 + Math.abs(Math.sin(t*2))*0.4;

    controls.update(); renderer.render(scene, camera);
  }
  animate();

  startIntro();                                   // 一開始就定位到遠方起點，進場飛行
  setTimeout(()=> loaderEl.classList.add('hide'), 500);
  setTimeout(()=>{ hintEl.style.opacity=0; }, 10000);
  </script>
</body>
