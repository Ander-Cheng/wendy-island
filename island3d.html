<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wendy 島 3D｜寶寶・我的女朋友</title>
<style>
  :root{
    --coral:#ff5d8f;
    --sea-deep:#2a6f97;
    --ink:#2b2d42;
    --cream:#fffaf3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---- loading ---- */
  #loader{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:linear-gradient(180deg,#caf0f8,#a9d6e5);color:var(--sea-deep);
    transition:opacity .6s;
  }
  #loader.hide{opacity:0;pointer-events:none}
  .spin{width:54px;height:54px;border:6px solid #fff;border-top-color:var(--coral);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- title overlay ---- */
  #title{
    position:fixed;top:26px;left:0;width:100%;text-align:center;z-index:10;
    pointer-events:none;
  }
  #title h1{
    font-size:clamp(2rem,7vw,3.6rem);color:#fff;letter-spacing:2px;
    text-shadow:0 3px 0 var(--coral),0 8px 20px rgba(42,111,151,.4);
  }
  #title p{
    margin-top:8px;font-size:clamp(.9rem,3vw,1.15rem);color:var(--sea-deep);
    display:inline-block;background:rgba(255,255,255,.7);padding:6px 18px;border-radius:999px;
  }
  #title p b{color:var(--coral)}

  /* ---- hint ---- */
  #hint{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(255,255,255,.8);color:var(--sea-deep);padding:9px 20px;border-radius:999px;
    font-size:.9rem;box-shadow:0 6px 18px rgba(42,111,151,.25);white-space:nowrap;
    transition:opacity .5s;
  }

  /* ---- info card ---- */
  #card{
    position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);
    width:min(420px,88vw);max-height:80vh;overflow:auto;background:var(--cream);
    border-radius:24px;padding:28px 26px 26px;box-shadow:0 24px 60px rgba(42,111,151,.4);
    border:4px solid #fff;opacity:0;pointer-events:none;transition:all .3s;
  }
  #card.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #card .close{position:absolute;top:12px;right:16px;font-size:26px;cursor:pointer;color:#bbb;border:none;background:none}
  #card .close:hover{color:var(--coral)}
  #card .ic{font-size:50px;text-align:center}
  #card h2{text-align:center;color:var(--coral);margin:8px 0 16px;font-size:1.6rem}
  #card .body{color:#55707f;line-height:1.75;font-size:1.02rem}
  #card .body .row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #ffe0ea}
  #card .body .row:last-child{border-bottom:none}
  #card .body .row .k{font-size:28px;flex:0 0 auto}
  #card .body .row .v b{color:var(--coral)}
  #card .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  #card .chip{background:#fff0f5;color:var(--coral);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.95rem}

  /* propose card special styling */
  #card.propose{border-color:#ff8fab;box-shadow:0 24px 70px rgba(255,93,143,.5);background:linear-gradient(180deg,#fffaf3,#fff0f5)}
  #card.propose h2{font-size:1.8rem;background:linear-gradient(90deg,#ff5d8f,#ff8fab);-webkit-background-clip:text;background-clip:text;color:transparent;animation:beat 1.6s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.06)}}
  #yesBtn{
    font-size:1.25rem;font-weight:800;color:#fff;cursor:pointer;border:none;
    padding:14px 42px;border-radius:999px;
    background:linear-gradient(90deg,#ff5d8f,#ff8fab);
    box-shadow:0 10px 24px rgba(255,93,143,.5);
    transition:transform .2s;animation:beat 1.4s infinite;
  }
  #yesBtn:hover{transform:scale(1.08)}
  #yesBtn:active{transform:scale(.96)}

  /* ---- 2d link ---- */
  #back2d{
    position:fixed;top:18px;right:18px;z-index:10;background:rgba(255,255,255,.85);
    color:var(--sea-deep);text-decoration:none;padding:8px 16px;border-radius:999px;
    font-size:.88rem;font-weight:700;box-shadow:0 6px 16px rgba(42,111,151,.25);
  }
  #back2d:hover{background:#fff}
</style>
</head>
<body>
  <div id="app"></div>

  <div id="loader">
    <div class="spin"></div>
    <div>正在組合 Wendy 島…</div>
  </div>

  <div id="title">
    <h1>Wendy 島</h1>
    <p>暱稱 <b>寶寶</b> ・ 我的女朋友 ・ <b>讓人又愛又恨</b> 😤❤️</p>
  </div>

  <a id="back2d" href="index.html">← 2D 版</a>

  <div id="hint">🖱️ 拖曳旋轉 ・ 滾輪縮放 ・ 點中央的 Wendy 👑 與周邊小島探索</div>

  <div id="card">
    <button class="close" aria-label="close">×</button>
    <div class="ic" id="card-ic">💖</div>
    <h2 id="card-title">標題</h2>
    <div class="body" id="card-body"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const loaderEl = document.getElementById('loader');
  const hintEl = document.getElementById('hint');

  // ---------- scene ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe9f5);
  scene.fog = new THREE.Fog(0xbfe9f5, 55, 130);

  const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
  camera.position.set(22, 20, 26);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('app').appendChild(renderer.domElement);

  // shared interaction state (declared early to avoid TDZ)
  let fly = null;
  let proposeActive = false;

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 6;
  controls.maxDistance = 70;
  controls.maxPolarAngle = Math.PI/2.15;
  controls.target.set(0, 1.5, 0);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0x88bbdd, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(12, 20, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
  sun.shadow.camera.far = 80;
  scene.add(sun);

  // ---------- helpers ----------
  const flat = (c) => new THREE.MeshStandardMaterial({ color:c, flatShading:true, roughness:.9, metalness:0 });

  // ---------- sea ----------
  const seaGeo = new THREE.PlaneGeometry(200, 200, 80, 80);
  const seaMat = new THREE.MeshStandardMaterial({ color:0x4ba3c7, flatShading:true, roughness:.6, transparent:true, opacity:.95 });
  const sea = new THREE.Mesh(seaGeo, seaMat);
  sea.rotation.x = -Math.PI/2;
  sea.position.y = -0.4;
  sea.receiveShadow = true;
  scene.add(sea);
  const seaBase = seaGeo.attributes.position.array.slice();

  // ---------- island ----------
  const island = new THREE.Group();
  scene.add(island);

  // sand (cone-ish cylinder)
  const sand = new THREE.Mesh(new THREE.CylinderGeometry(9, 11, 2.2, 10), flat(0xffe0b3));
  sand.position.y = 0.1; sand.castShadow = sand.receiveShadow = true;
  island.add(sand);

  // dirt underside
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 2, 5, 9), flat(0xb5835a));
  dirt.position.y = -3; island.add(dirt);

  // grass top
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(7.6, 9, 1.2, 10), flat(0x8cd17d));
  grass.position.y = 1.3; grass.castShadow = grass.receiveShadow = true;
  island.add(grass);

  // little hill
  const hill = new THREE.Mesh(new THREE.ConeGeometry(3.2, 3.2, 8), flat(0x72c267));
  hill.position.set(-3.2, 2.6, -2.6); hill.castShadow = true;
  island.add(hill);

  // ---------- trees ----------
  function palm(x, z, s=1){
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18, .3, 3*s, 6), flat(0xb07a43));
    trunk.position.y = 1.5*s; trunk.castShadow = true; g.add(trunk);
    for(let i=0;i<5;i++){
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(.35*s, 2.2*s, 5), flat(0x5fb85a));
      leaf.position.y = 3*s; leaf.rotation.z = Math.PI/2.6;
      leaf.rotation.y = i*(Math.PI*2/5);
      leaf.position.x = Math.cos(i*(Math.PI*2/5))*1.1*s;
      leaf.position.z = Math.sin(i*(Math.PI*2/5))*1.1*s;
      leaf.castShadow = true; g.add(leaf);
    }
    g.position.set(x, 1.8, z); g.scale.setScalar(s);
    island.add(g);
  }
  palm(4.5, -3.5, 1.1);
  palm(-5.5, 1.5, 0.9);
  palm(2, 4.8, 1);

  // decorative rocks + flag
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(.9, 0), flat(0xa9b4bc));
  rock.position.set(5, 1.8, 3); rock.castShadow = true; island.add(rock);

  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,4,6), flat(0xdddddd));
  pole.position.set(-3.2, 5.6, -2.6); island.add(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.6,1), new THREE.MeshStandardMaterial({color:0xff5d8f,flatShading:true,side:THREE.DoubleSide}));
  flag.position.set(-2.45, 6.6, -2.6); island.add(flag);

  // ---------- clouds ----------
  const clouds = [];
  function cloud(x,y,z){
    const g = new THREE.Group();
    const m = flat(0xffffff);
    [[0,0,0,1.4],[1.2,-.2,0,1],[-1.2,-.1,.2,.9],[.3,.6,-.3,.8]].forEach(p=>{
      const s = new THREE.Mesh(new THREE.IcosahedronGeometry(p[3],0), m);
      s.position.set(p[0],p[1],p[2]); g.add(s);
    });
    g.position.set(x,y,z); g.scale.setScalar(1.3);
    scene.add(g); clouds.push(g);
  }
  cloud(-18,12,-10); cloud(18,14,4); cloud(3,16,-20); cloud(-6,13,18); cloud(22,11,-14);

  // ---------- interactive blocks ----------
  const DATA = {
    personality: {
      ic:'✨', title:'她是怎樣的人',
      html:`
        <div class="row"><div class="k">🎀</div><div class="v"><b>可愛</b><br>一舉一動都讓人融化，笑起來能照亮整座島。</div></div>
        <div class="row"><div class="k">🤲</div><div class="v"><b>貼心</b><br>總是先想到別人，默默把溫暖準備好。</div></div>
        <div class="row"><div class="k">💪</div><div class="v"><b>勤奮</b><br>認真又努力，設定目標就穩穩前進，超可靠。</div></div>`
    },
    zoo: {
      ic:'🐾', title:'可愛動物園',
      html:`<div class="chips">
        <span class="chip">🐱 貓</span><span class="chip">🐶 狗</span>
        <span class="chip">🐢 烏龜</span><span class="chip">🐴 小馬</span>
        <span class="chip">🐑 羊</span><span class="chip">🦎 變色龍</span>
      </div><p style="text-align:center;margin-top:14px;color:#7a95a3">寶寶最愛的毛茸茸朋友們 💕</p>`
    },
    trips: {
      ic:'✈️', title:'一起走過的旅行足跡',
      html:`
        <div class="row"><div class="k">🇻🇳</div><div class="v"><b>富國島</b>　陽光、海灘與椰林</div></div>
        <div class="row"><div class="k">🗼</div><div class="v"><b>東京</b>　繁華又浪漫的日本</div></div>
        <div class="row"><div class="k">🌺</div><div class="v"><b>沖繩</b>　碧海藍天的度假島</div></div>
        <div class="row"><div class="k">🇰🇷</div><div class="v"><b>釜山</b>　海港城市的悠閒</div></div>
        <div class="row"><div class="k">🏔️</div><div class="v"><b>湯澤</b>　雪國溫泉的浪漫</div></div>`
    },
    journey: {
      ic:'🗺️', title:'她的人生航線',
      html:`
        <div class="row"><div class="k">👶</div><div class="v"><b>1994</b>　寶寶降臨世界，故事的起點。</div></div>
        <div class="row"><div class="k">🎓</div><div class="v"><b>2016</b>　文化大學畢業，帶著夢想出發。</div></div>
        <div class="row"><div class="k">🛋️</div><div class="v"><b>2019</b>　在 Crate &amp; Barrel 相遇。</div></div>
        <div class="row"><div class="k">💑</div><div class="v"><b>2023</b>　正式在一起，島上有了我們。</div></div>`
    },
    propose: {
      ic:'💍', title:'Will you marry me?',
      html:`
        <p style="text-align:center;color:#6b7b86;line-height:1.9;margin-bottom:6px">
          親愛的寶寶，謝謝妳走進我的世界，成為這座島的名字。<br>
          從 Crate &amp; Barrel 的相遇，到現在的每一天，<br>
          我想把剩下的人生，都留在這座島上陪妳。
        </p>
        <div id="propose-actions" style="text-align:center;margin-top:18px">
          <button id="yesBtn">Yes, I do 💍</button>
        </div>
        <p id="propose-answer" style="display:none;text-align:center;margin-top:16px;font-size:1.3rem;color:#ff5d8f;font-weight:800;line-height:1.7">
          💖 她答應了！<br>從今天起，Wendy 島永遠有我們兩個人 💑
        </p>`
    }
  };

  // ======================================================
  //  INTERACTIVE LANDMARK MODELS (low-poly, specific shapes)
  // ======================================================
  const blocks = [];

  function textLabel(label, y){
    const lc = document.createElement('canvas'); lc.width=256; lc.height=64;
    const lx = lc.getContext('2d');
    lx.fillStyle='#2a6f97'; lx.font='bold 34px "Microsoft JhengHei",sans-serif';
    lx.textAlign='center'; lx.textBaseline='middle'; lx.fillText(label,128,36);
    const ltex = new THREE.CanvasTexture(lc);
    const lspr = new THREE.Sprite(new THREE.SpriteMaterial({ map:ltex, transparent:true, depthTest:false }));
    lspr.scale.set(3,0.75,1); lspr.position.y = y;
    return lspr;
  }

  // --- build a small floating satellite island at world (wx,wz) ---
  const satellites = [];           // small islands {group, bobPhase}
  function buildSatelliteIsland(wx, wz, tint){
    const g = new THREE.Group();
    const sand = new THREE.Mesh(new THREE.CylinderGeometry(3.4,4.2,1.4,9), flat(0xffe0b3));
    sand.position.y = 0; sand.castShadow = sand.receiveShadow = true; g.add(sand);
    const dirt = new THREE.Mesh(new THREE.CylinderGeometry(2.8,0.8,3,8), flat(0xb5835a));
    dirt.position.y = -2.1; g.add(dirt);
    const grass = new THREE.Mesh(new THREE.CylinderGeometry(2.9,3.5,0.8,9), flat(tint||0x8cd17d));
    grass.position.y = 0.9; grass.castShadow = grass.receiveShadow = true; g.add(grass);
    // a tiny palm for charm
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.8,6), flat(0xb07a43));
    trunk.position.set(1.8,1.8,1.4); g.add(trunk);
    for(let i=0;i<4;i++){
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(.25,1.3,5), flat(0x5fb85a));
      leaf.position.set(1.8,2.7,1.4); leaf.rotation.z=Math.PI/2.6; leaf.rotation.y=i*(Math.PI/2);
      leaf.position.x += Math.cos(i*Math.PI/2)*0.7; leaf.position.z += Math.sin(i*Math.PI/2)*0.7;
      g.add(leaf);
    }
    g.position.set(wx, 0.6, wz);
    scene.add(g);
    satellites.push({ group:g, phase:Math.random()*Math.PI*2 });
    return g;
  }

  // registers a landmark on its OWN satellite island
  function registerBlock(key, group, wx, wz, label, labelY, hitSize, tint){
    const isle = buildSatelliteIsland(wx, wz, tint);
    const hit = new THREE.Mesh(new THREE.BoxGeometry(hitSize,hitSize,hitSize),
                 new THREE.MeshBasicMaterial({visible:false}));
    hit.position.y = hitSize/2;
    group.add(hit);
    group.add(textLabel(label, labelY));
    group.position.set(0, 1.3, 0);          // sit on top of the satellite
    isle.add(group);
    group.userData = { key, baseY:1.3, phase:Math.random()*Math.PI*2, cube:hit, focus:new THREE.Vector3(wx,2,wz) };
    blocks.push(group);
  }

  // --- 個性：愛心 ---
  function buildHeart(){
    const g = new THREE.Group();
    const shape = new THREE.Shape();
    shape.moveTo(0,0.5);
    shape.bezierCurveTo(0,0.9, -0.5,1.2, -0.9,0.7);
    shape.bezierCurveTo(-1.4,0.1, -0.5,-0.5, 0,-1);
    shape.bezierCurveTo(0.5,-0.5, 1.4,0.1, 0.9,0.7);
    shape.bezierCurveTo(0.5,1.2, 0,0.9, 0,0.5);
    const geo = new THREE.ExtrudeGeometry(shape,{depth:0.5,bevelEnabled:true,bevelThickness:0.12,bevelSize:0.12,bevelSegments:1,steps:1});
    geo.center();
    const heart = new THREE.Mesh(geo, flat(0xff5d8f));
    heart.scale.setScalar(1.1); heart.position.y = 1.2; heart.castShadow = true;
    g.add(heart);
    return g;
  }

  // --- 動物園：柵欄 + 招牌 ---
  function buildZoo(){
    const g = new THREE.Group();
    const postMat = flat(0xcf9b6a), railMat = flat(0xe8c39e);
    for(let i=-1;i<=1;i++){
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.22,1.1,0.22), postMat);
      p.position.set(i*0.9,0.55,0); p.castShadow=true; g.add(p);
    }
    const rail = new THREE.Mesh(new THREE.BoxGeometry(2.1,0.2,0.15), railMat);
    rail.position.set(0,0.75,0); g.add(rail);
    const rail2 = rail.clone(); rail2.position.y=0.45; g.add(rail2);
    // sign board
    const board = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.8,0.12), flat(0xffd166));
    board.position.set(0,1.7,0); board.castShadow=true; g.add(board);
    const paw = new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex('🐾'),transparent:true}));
    paw.scale.set(0.7,0.7,1); paw.position.set(0,1.7,0.1); g.add(paw);
    return g;
  }

  // --- 旅行：小飛機 ---
  function buildPlane(){
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.6,4,8), flat(0xffffff));
    body.rotation.z = Math.PI/2; body.position.y=1.2; body.castShadow=true; g.add(body);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.4,0.6,8), flat(0xff5d8f));
    nose.rotation.z=-Math.PI/2; nose.position.set(1.3,1.2,0); g.add(nose);
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.1,2.6), flat(0x90e0ef));
    wing.position.y=1.2; wing.castShadow=true; g.add(wing);
    const tailW = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.1,1), flat(0x90e0ef));
    tailW.position.set(-1.1,1.25,0); g.add(tailW);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.6,0.1), flat(0xff5d8f));
    fin.position.set(-1.1,1.55,0); g.add(fin);
    return g;
  }

  // --- 人生：里程碑路標 ---
  function buildMilestone(){
    const g = new THREE.Group();
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,2.2,8), flat(0xb5835a));
    post.position.y=1.1; post.castShadow=true; g.add(post);
    const cols = [0xff5d8f,0xffd166,0x90e0ef];
    cols.forEach((c,i)=>{
      const s = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.4,0.14), flat(c));
      s.position.set(i%2?0.3:-0.3, 1.9-i*0.5, 0);
      s.rotation.y = i%2?0.2:-0.2; s.castShadow=true; g.add(s);
    });
    const star = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35,0), flat(0xffe066));
    star.position.y=2.4; star.castShadow=true; g.add(star);
    return g;
  }

  // emoji -> texture helper
  function emojiTex(e,size=128){
    const cv=document.createElement('canvas'); cv.width=cv.height=size;

  function bubbleTex(text){
    const cv=document.createElement('canvas'); cv.width=256; cv.height=128;
    const c=cv.getContext('2d');
    c.fillStyle='rgba(255,255,255,.95)';
    roundRect(c,8,8,240,86,22); c.fill();
    c.beginPath(); c.moveTo(118,92); c.lineTo(138,92); c.lineTo(128,118); c.closePath(); c.fill();
    c.fillStyle='#ff5d8f'; c.font='bold 30px "Microsoft JhengHei",sans-serif';
    c.textAlign='center'; c.textBaseline='middle'; c.fillText(text,128,50);
    return new THREE.CanvasTexture(cv);
  }
  function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

  // ---------- raycast / click ----------
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hovered = null;

  function pointer(e){
    const t = e.touches ? e.touches[0] : e;
    mouse.x = (t.clientX/innerWidth)*2-1;
    mouse.y = -(t.clientY/innerHeight)*2+1;
  }
  function pick(){
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObjects(blocks.map(b=>b.userData.cube), false);
    return hits.length ? blocks.find(b=>b.userData.cube===hits[0].object) : null;
  }
  function pickCritter(){
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObjects(residents.map(r=>r.userData.hit), false);
    return hits.length ? residents.find(r=>r.userData.hit===hits[0].object) : null;
  }

  let hoveredCritter = null;
  renderer.domElement.addEventListener('pointermove', e=>{
    pointer(e);
    const b = pick();
    if(b!==hovered){ hovered = b; }
    const c = pickCritter();
    if(c!==hoveredCritter){
      if(hoveredCritter) hoveredCritter.userData.bubble.visible = false;
      hoveredCritter = c;
      if(c) c.userData.bubble.visible = true;
    }
    const w = pickWendy();
    renderer.domElement.style.cursor = (b||c||w) ? 'pointer' : 'grab';
  });

  function pickWendy(){
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObject(wendy.userData.hit, false);
    return hits.length ? wendy : null;
  }

  let downX=0, downY=0;
  renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; });
  renderer.domElement.addEventListener('pointerup', e=>{
    if(Math.abs(e.clientX-downX)>6 || Math.abs(e.clientY-downY)>6) return; // was a drag
    pointer(e);
    // Wendy first (centre star)
    if(pickWendy()){ flyTo(new THREE.Vector3(0,2.2,0), 9); openCard('propose'); return; }
    const b = pick();
    if(b){ flyTo(b.userData.focus, 11); openCard(b.userData.key); return; }
    const c = pickCritter();
    if(c){ c.userData.bubble.visible = true; openCard('zoo'); }
  });

  // ---------- camera fly-to ----------
  function flyTo(targetPoint, dist){
    // compute a camera position: pull back from target toward current view direction
    const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    const camTo = new THREE.Vector3().copy(targetPoint).add(dir.multiplyScalar(dist));
    camTo.y = Math.max(camTo.y, targetPoint.y + 3);
    fly = { camFrom:camera.position.clone(), camTo, tgtFrom:controls.target.clone(), tgtTo:targetPoint.clone(), t:0 };
    controls.autoRotate = false;
  }

  // ---------- card ----------
  const cardEl = document.getElementById('card');
  function openCard(key){
    const d = DATA[key];
    document.getElementById('card-ic').textContent = d.ic;
    document.getElementById('card-title').textContent = d.title;
    document.getElementById('card-body').innerHTML = d.html;
    cardEl.classList.toggle('propose', key==='propose');
    cardEl.classList.add('show');
    controls.autoRotate = false;
    hintEl.style.opacity = 0;

  cardEl.querySelector('.close').addEventListener('click', closeCard);

  // ---------- propose interaction ----------
  function wirePropose(){
    const btn = document.getElementById('yesBtn');
    if(!btn) return;
    // make the "no" feeling impossible: only a Yes button, and it celebrates
    const run = ()=>{
      document.getElementById('propose-actions').style.display='none';
      document.getElementById('propose-answer').style.display='block';
      confettiBurst();
      proposeActive = true;   // trigger 3D heart rain
    };
    btn.addEventListener('click', run);
  }

  // DOM confetti
  function confettiBurst(){
    const emojis=['💖','💍','🎉','💕','✨','💗'];
    for(let i=0;i<60;i++){
      const s=document.createElement('div');
      s.textContent=emojis[i%emojis.length];
      s.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-40px;font-size:${18+Math.random()*22}px;z-index:40;pointer-events:none;transition:transform ${2+Math.random()*2}s linear, opacity 3s`;
      document.body.appendChild(s);

        s.style.transform=`translateY(${100+Math.random()*20}vh) rotate(${Math.random()*720-360}deg)`;

      });
      setTimeout(()=>s.remove(),4500);
    }
  }

  // ---------- 3D heart rain ----------
  const heartGeoShape = (()=> {
    const sh=new THREE.Shape();
    sh.moveTo(0,0.5);
    sh.bezierCurveTo(0,0.9,-0.5,1.2,-0.9,0.7);
    sh.bezierCurveTo(-1.4,0.1,-0.5,-0.5,0,-1);
    sh.bezierCurveTo(0.5,-0.5,1.4,0.1,0.9,0.7);
    sh.bezierCurveTo(0.5,1.2,0,0.9,0,0.5);
    const g=new THREE.ExtrudeGeometry(sh,{depth:0.3,bevelEnabled:false});
    g.center(); g.scale(0.4,0.4,0.4);
    return g;
  })();
  const rainHearts=[];
  let rainInit=false;
  function initHeartRain(){
    const cols=[0xff5d8f,0xff8fab,0xffd166,0xffffff];
    for(let i=0;i<40;i++){
      const m=new THREE.Mesh(heartGeoShape, flat(cols[i%cols.length]));
      m.position.set((Math.random()-0.5)*30, 8+Math.random()*12, (Math.random()-0.5)*30);
      m.userData={vy:0.04+Math.random()*0.06, spin:(Math.random()-0.5)*0.1, startY:m.position.y};
      scene.add(m); rainHearts.push(m);
    }
    rainInit=true;
  }
  function heartRainStep(){
    if(!rainInit) initHeartRain();
    rainHearts.forEach(h=>{
      h.position.y -= h.userData.vy*4;
      h.rotation.y += h.userData.spin;
      h.rotation.z += h.userData.spin*0.5;
      if(h.position.y < -2){ h.position.y = 10+Math.random()*10; h.position.x=(Math.random()-0.5)*30; h.position.z=(Math.random()-0.5)*30; }
    });
  }

  // ---------- animate ----------
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // wavy sea
    const pos = sea.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      const ix = i*3;
      const x = seaBase[ix], y = seaBase[ix+1];
      pos.array[ix+2] = Math.sin(x*0.3 + t*1.2)*0.25 + Math.cos(y*0.3 + t)*0.25;
    }
    pos.needsUpdate = true;

    // floating main island
    island.position.y = Math.sin(t*0.8)*0.18;

    // floating satellite islands (each with its own bob)
    satellites.forEach(s=>{
      s.group.position.y = 0.6 + Math.sin(t*0.7 + s.phase)*0.3;
    });

    // Wendy: gentle spin, bob, rotating halo
    if(wendy){
      wendy.position.y = wendy.userData.baseY + Math.sin(t*1.1)*0.12;
      wendy.rotation.y = Math.sin(t*0.4)*0.5;
      wendy.userData.halo.rotation.y += 0.02;
    }

    // camera fly-to easing
    if(fly){
      fly.t = Math.min(1, fly.t + 0.02);
      const e = 1-Math.pow(1-fly.t,3);   // easeOutCubic
      camera.position.lerpVectors(fly.camFrom, fly.camTo, e);
      controls.target.lerpVectors(fly.tgtFrom, fly.tgtTo, e);
      if(fly.t>=1) fly=null;
    }

    // 3D heart rain when she says yes
    if(proposeActive) heartRainStep(t);

    // bobbing blocks + hover scale
    blocks.forEach(b=>{
      b.position.y = b.userData.baseY + Math.sin(t*1.5 + b.userData.phase)*0.15;
      b.rotation.y += 0.004;
      const target = (b===hovered) ? 1.18 : 1;
      b.scale.lerp(new THREE.Vector3(target,target,target), 0.15);
    });

    // wandering residents
    residents.forEach(r=>{
      const u = r.userData;
      u.angle += u.turn + 0.004;
      // move forward along facing direction
      const nx = r.position.x + Math.sin(u.angle)*u.speed*0.08;
      const nz = r.position.z + Math.cos(u.angle)*u.speed*0.08;
      // keep within island disc (radius ~6.3)
      if(Math.hypot(nx,nz) < 6.3){
        r.position.x = nx; r.position.z = nz;
      } else {
        u.angle += Math.PI;      // bounce back inward
        u.turn = (Math.random()-0.5)*0.02;
      }
      r.rotation.y = u.angle;
      // little hop + float with island
      const hop = Math.abs(Math.sin(t*4 + u.phase))*0.12;
      r.position.y = u.baseY + hop;
      // gentle scale-up on hover (whole critter)
      const s = (r===hoveredCritter)?1.22:1;
      r.scale.lerp(new THREE.Vector3(s,s,s), 0.18);
    });

    // drifting clouds
    clouds.forEach((c,i)=>{
      c.position.x += 0.01 + i*0.003;
      if(c.position.x > 26) c.position.x = -26;
    });

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // hide loader
  setTimeout(()=> loaderEl.classList.add('hide'), 500);
  setTimeout(()=>{ hintEl.style.opacity = 0; }, 9000);
  </script>
</body>
</html>
